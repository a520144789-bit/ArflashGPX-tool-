<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Suderpanda GPX v3.4</title>
    <style>
        :root { --primary: #6c5ce7; --success: #00b894; --bg: #f8f9fa; }
        body { font-family: system-ui, sans-serif; background: var(--bg); padding: 15px; color: #2d3436; margin: 0; }
        .card { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: var(--primary); font-size: 18px; margin-bottom: 12px; }
        textarea { width: 100%; height: 80px; border: 2px solid #e2e8f0; border-radius: 12px; padding: 8px; box-sizing: border-box; font-size: 12px; margin-bottom: 10px; }
        
        .stats-panel { background: #f1f2f6; padding: 12px; border-radius: 15px; margin-bottom: 15px; display: flex; flex-direction: column; gap: 5px; }
        .stats-row { display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
        .stats-row b { color: var(--primary); font-size: 16px; }
        #speedInput { width: 45px; padding: 3px; border: 2px solid var(--primary); border-radius: 8px; text-align: center; font-weight: bold; }

        .map-container { width: 100%; background: #1e272e; border-radius: 16px; margin-bottom: 15px; height: 320px; overflow: hidden; border: 1px solid #dcdde1; position: relative; }
        canvas { width: 100%; height: 100%; display: block; touch-action: none; }
        
        .btn-group { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 15px; }
        button { padding: 12px 2px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 13px; color: white; }
        .btn-analyze { background: var(--success); }
        .btn-copy { background: #0984e3; }
        .btn-download { background: var(--primary); }

        #sortableList { display: grid; grid-template-columns: repeat(auto-fill, minmax(50px, 1fr)); gap: 10px; padding: 0; margin: 0; }
        .sort-item { background: #fff; border: 2px solid #eee; height: 50px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: bold; color: var(--primary); touch-action: none; user-select: none; }
        .sort-item.dragging { background: #e0e0ff; border-color: var(--primary); transform: scale(1.1); z-index: 100; box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        
        #toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); color: white; padding: 8px 20px; border-radius: 20px; font-size: 13px; opacity: 0; transition: 0.3s; z-index: 1000; pointer-events: none; }
    </style>
</head>
<body>

<div class="card">
    <h1>🐼 Suderpanda v3.4 (雙層象限修正)</h1>
    <textarea id="coordsInput" placeholder="在此貼上座標..."></textarea>

    <div class="stats-panel">
        <div class="stats-row">
            <span>載入點數：<b id="pointCount">0</b> / 距離：<b id="totalDist">0.00</b> km</span>
            <div>時速：<input type="number" id="speedInput" value="15" oninput="updateStats()"> km/h</div>
        </div>
        <div class="stats-row">
            <span>20 邏輯耗時：<b id="totalTime">0</b> 分鐘</span>
        </div>
    </div>

    <div class="btn-group">
        <button class="btn-analyze" onclick="analyzePoints()">🔍 分析排序</button>
        <button class="btn-copy" onclick="copyFinalGPX()">📋 複製</button>
        <button class="btn-download" onclick="downloadFinalGPX()">💾 下載</button>
    </div>

    <div class="map-container">
        <canvas id="mapCanvas"></canvas>
    </div>
    <ul id="sortableList"></ul>
</div>

<div id="toast"></div>

<script>
let masterCenters = [];
let selectedIndex = null;
let dragEl = null;
const RADIUS = 36;
const LAT_M_PER_DEG = 111132;
const RULES = { "NE_SE": [45, 315, "01", 225, 135], "NE_SW": [45, 315, "01", 135, 225], "NE_NW": [45, 135, "01", 225, 315], "NW_NE": [315, 225, "01", 135, 45], "NW_SE": [315, 45, "01", 225, 135], "NW_SW": [315, 45, "01", 135, 225], "SE_SW": [135, 45, "01", 315, 225], "SE_NW": [135, 225, "01", 45, 315], "SE_NE": [135, 225, "01", 315, 45], "SW_NW": [225, 135, "01", 45, 315], "SW_NE": [225, 135, "01", 315, 45], "SW_SE": [225, 315, "01", 45, 135] };

window.onload = () => {
    const canvas = document.getElementById('mapCanvas');
    canvas.addEventListener('click', handleMapClick);
    canvas.addEventListener('contextmenu', (e) => { e.preventDefault(); handleMapLongPress(e); });
};

// --- 修正後的雙層象限邏輯 ---
function splitToFour(pts) {
    if (pts.length === 0) return [[],[],[],[]];
    let lats = pts.map(p => p.lat), lons = pts.map(p => p.lon);
    let midLat = (Math.min(...lats) + Math.max(...lats)) / 2;
    let midLon = (Math.min(...lons) + Math.max(...lons)) / 2;
    let res = [[],[],[],[]]; // 0:NE, 1:NW, 2:SW, 3:SE
    pts.forEach(p => {
        if (p.lat >= midLat && p.lon >= midLon) res[0].push(p);
        else if (p.lat >= midLat && p.lon < midLon) res[1].push(p);
        else if (p.lat < midLat && p.lon < midLon) res[2].push(p);
        else res[3].push(p);
    });
    return res;
}

function analyzePoints() {
    const input = document.getElementById('coordsInput').value.trim();
    let raw = [];
    input.split('\n').forEach(line => {
        let p = line.trim().split(/[,|\s\t]+/);
        if (p.length >= 2) {
            let lat = parseFloat(p[0]), lon = parseFloat(p[1]);
            if (!isNaN(lat) && !isNaN(lon)) raw.push({lat, lon});
        }
    });

    if (raw.length === 0) return;
    
    // 1. 基本去重
    raw = raw.filter((p, i, self) => i === self.findIndex(t => Math.abs(t.lat-p.lat)<1e-7 && Math.abs(t.lon-p.lon)<1e-7));

    // 2. 第一層大象限
    let bigQ = splitToFour(raw);
    masterCenters = [];

    const runTSP = (points) => {
        if (points.length <= 1) return [...points];
        let pool = [...points], ordered = [pool.splice(0,1)[0]];
        while(pool.length > 0) {
            let best = 0, minDist = Infinity;
            let last = ordered[ordered.length-1];
            pool.forEach((p, i) => {
                let d = Math.pow(p.lat - last.lat, 2) + Math.pow(p.lon - last.lon, 2);
                if(d < minDist) { minDist = d; best = i; }
            });
            ordered.push(pool.splice(best, 1)[0]);
        }
        return ordered;
    };

    // 3. 仿照原始穩定邏輯的提取順序
    const extractSub = (quads) => {
        let subQ = splitToFour(quads);
        // NE 大區內部的提取順序：SW -> NW -> NE -> SE (之字型)
        masterCenters.push(...runTSP(subQ[0])); 
        masterCenters.push(...runTSP(subQ[1]));
        masterCenters.push(...runTSP(subQ[2]));
        masterCenters.push(...runTSP(subQ[3]));
    };

    // 依序處理四大區
    [0, 1, 2, 3].forEach(idx => {
        if (bigQ[idx].length > 0) {
            // 這裡直接對象限內的點跑 TSP，或是更細分
            let sub = splitToFour(bigQ[idx]);
            // NE 區
            if(idx === 0) { masterCenters.push(...runTSP(sub[3]), ...runTSP(sub[0]), ...runTSP(sub[1]), ...runTSP(sub[2])); }
            // NW 區
            else if(idx === 1) { masterCenters.push(...runTSP(sub[0]), ...runTSP(sub[1]), ...runTSP(sub[2]), ...runTSP(sub[3])); }
            // SW 區
            else if(idx === 2) { masterCenters.push(...runTSP(sub[1]), ...runTSP(sub[2]), ...runTSP(sub[3]), ...runTSP(sub[0])); }
            // SE 區
            else { masterCenters.push(...runTSP(sub[2]), ...runTSP(sub[3]), ...runTSP(sub[0]), ...runTSP(sub[1])); }
        }
    });

    document.getElementById('pointCount').innerText = masterCenters.length;
    showToast(`載入完成：共 ${masterCenters.length} 點`);
    renderAll();
}

// --- 交互與繪圖功能 (維持最新版交互) ---
function handleMapClick(e) {
    if (masterCenters.length === 0) return;
    const rect = document.getElementById('mapCanvas').getBoundingClientRect();
    const x = e.clientX - rect.left, y = e.clientY - rect.top;
    const idx = getClickedIdx(x, y);
    if (idx !== -1) {
        if (selectedIndex === null) {
            selectedIndex = idx;
            showToast(`選中 #${idx + 1}`);
        } else {
            if (selectedIndex !== idx) {
                [masterCenters[selectedIndex], masterCenters[idx]] = [masterCenters[idx], masterCenters[selectedIndex]];
                showToast(`交換完成`);
            }
            selectedIndex = null;
            renderAll();
        }
        drawMap();
    }
}

function handleMapLongPress(e) {
    if (masterCenters.length === 0) return;
    const rect = document.getElementById('mapCanvas').getBoundingClientRect();
    const x = e.clientX - rect.left, y = e.clientY - rect.top;
    let nearby = masterCenters.map((_, i) => i).filter(i => getDistToClick(i, x, y) < 30);
    if (nearby.length > 1) {
        let cur = nearby.indexOf(selectedIndex);
        selectedIndex = nearby[(cur + 1) % nearby.length];
        showToast(`選中 #${selectedIndex + 1}`);
        drawMap();
    }
}

function getDistToClick(idx, cx, cy) {
    const canvas = document.getElementById('mapCanvas');
    const rect = canvas.getBoundingClientRect();
    const lats = masterCenters.map(p => p.lat), lons = masterCenters.map(p => p.lon);
    if(lats.length === 0) return 999;
    const minLat = Math.min(...lats), maxLat = Math.max(...lats), minLon = Math.min(...lons), maxLon = Math.max(...lons), pad = 40;
    const getX = (lon) => pad + (maxLon === minLon ? (rect.width-pad*2)/2 : (lon - minLon) / (maxLon - minLon) * (rect.width - pad * 2));
    const getY = (lat) => pad + (maxLat === minLat ? (rect.height-pad*2)/2 : (maxLat - lat) / (maxLat - minLat) * (rect.height - pad * 2));
    return Math.hypot(getX(masterCenters[idx].lon) - cx, getY(masterCenters[idx].lat) - cy);
}

function getClickedIdx(x, y) {
    for (let i = 0; i < masterCenters.length; i++) if (getDistToClick(i, x, y) < 22) return i;
    return -1;
}

function updateStats() {
    if (masterCenters.length < 1) return;
    let totalMeters = 0, allSteps = [];
    const getQ = (c, t) => { let dL = t.lat-c.lat, dO = t.lon-c.lon; return (dL>=0 && dO>=0)?"NE":(dL>=0 && dO<0)?"NW":(dL<0 && dO<0)?"SW":"SE"; };

    masterCenters.forEach((center, i) => {
        let prev = i > 0 ? masterCenters[i-1] : masterCenters[masterCenters.length-1];
        let next = i < masterCenters.length-1 ? masterCenters[i+1] : masterCenters[0];
        (RULES[`${getQ(center, prev)}_${getQ(center, next)}`] || [45, 135, "01", 225, 315]).forEach(step => {
            let lat = center.lat, lon = center.lon;
            if (step !== "01") {
                let r = step * Math.PI / 180;
                lat += (RADIUS * Math.cos(r) / LAT_M_PER_DEG);
                lon += (RADIUS * Math.sin(r) / (LAT_M_PER_DEG * Math.cos(center.lat * Math.PI / 180)));
            }
            allSteps.push({lat, lon});
        });
    });

    for (let j = 0; j < allSteps.length - 1; j++) {
        const R = 6371e3, dLat = (allSteps[j+1].lat - allSteps[j].lat) * Math.PI / 180, dLon = (allSteps[j+1].lon - allSteps[j].lon) * Math.PI / 180;
        const a = Math.sin(dLat/2)**2 + Math.cos(allSteps[j].lat*Math.PI/180)*Math.cos(allSteps[j+1].lat*Math.PI/180)*Math.sin(dLon/2)**2;
        totalMeters += R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }
    const km = totalMeters / 1000;
    document.getElementById('totalDist').innerText = km.toFixed(2);
    document.getElementById('totalTime').innerText = Math.round((km / (parseFloat(document.getElementById('speedInput').value) || 1)) * 60);
}

function renderAll() { renderList(); drawMap(); updateStats(); }

function renderList() {
    const list = document.getElementById('sortableList');
    list.innerHTML = "";
    masterCenters.forEach((p, i) => {
        const li = document.createElement('li');
        li.className = 'sort-item'; li.dataset.index = i; li.innerText = i + 1;
        li.addEventListener('touchstart', (e) => { dragEl = e.currentTarget; dragEl.classList.add('dragging'); });
        li.addEventListener('touchmove', handleTouchMove);
        li.addEventListener('touchend', () => { if(dragEl) dragEl.classList.remove('dragging'); updateFromList(); });
        list.appendChild(li);
    });
}

function handleTouchMove(e) {
    e.preventDefault();
    const touch = e.touches[0], target = document.elementFromPoint(touch.clientX, touch.clientY)?.closest('.sort-item');
    if (target && target !== dragEl) {
        const rect = target.getBoundingClientRect();
        target.parentNode.insertBefore(dragEl, touch.clientX > rect.left + rect.width / 2 ? target.nextSibling : target);
    }
}

function updateFromList() {
    masterCenters = Array.from(document.querySelectorAll('.sort-item')).map(li => masterCenters[parseInt(li.dataset.index)]);
    renderAll();
}

function drawMap() {
    const canvas = document.getElementById('mapCanvas'), ctx = canvas.getContext('2d'), dpr = window.devicePixelRatio || 1, rect = canvas.getBoundingClientRect();
    canvas.width = rect.width * dpr; canvas.height = rect.height * dpr; ctx.scale(dpr, dpr);
    if (masterCenters.length === 0) return;
    const lats = masterCenters.map(p => p.lat), lons = masterCenters.map(p => p.lon);
    const minLat = Math.min(...lats), maxLat = Math.max(...lats), minLon = Math.min(...lons), maxLon = Math.max(...lons), pad = 40;
    const getX = (lon) => pad + (maxLon === minLon ? (rect.width-pad*2)/2 : (lon - minLon) / (maxLon - minLon) * (rect.width - pad * 2));
    const getY = (lat) => pad + (maxLat === minLat ? (rect.height-pad*2)/2 : (maxLat - lat) / (maxLat - minLat) * (rect.height - pad * 2));

    ctx.clearRect(0,0,rect.width, rect.height);
    ctx.beginPath(); ctx.strokeStyle = "#f1c40f"; ctx.setLineDash([4,2]);
    masterCenters.forEach((p, i) => { const x = getX(p.lon), y = getY(p.lat); if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y); });
    ctx.stroke(); ctx.setLineDash([]);
    masterCenters.forEach((p, i) => {
        const x = getX(p.lon), y = getY(p.lat);
        if (i === selectedIndex) { ctx.strokeStyle = "#ffeb3b"; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(x, y, 10, 0, Math.PI*2); ctx.stroke(); }
        ctx.fillStyle = (i === 0) ? "#2ecc71" : (i === masterCenters.length-1 ? "#e74c3c" : "#6c5ce7");
        ctx.beginPath(); ctx.arc(x, y, 5, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = "white"; ctx.font = "bold 10px Arial"; ctx.textAlign = "center"; ctx.fillText(i + 1, x, y - 10);
    });
}

function buildGPXString() {
    const getQ = (c, t) => { let dL = t.lat-c.lat, dO = t.lon-c.lon; return (dL>=0 && dO>=0)?"NE":(dL>=0 && dO<0)?"NW":(dL<0 && dO<0)?"SW":"SE"; };
    let gpx = '<?xml version="1.0" encoding="UTF-8"?><gpx version="1.1">';
    masterCenters.forEach((center, i) => {
        let prev = i > 0 ? masterCenters[i-1] : masterCenters[masterCenters.length-1];
        let next = i < masterCenters.length-1 ? masterCenters[i+1] : masterCenters[0];
        (RULES[`${getQ(center, prev)}_${getQ(center, next)}`] || [45, 135, "01", 225, 315]).forEach((step, sub) => {
            let lat = center.lat, lon = center.lon;
            if (step !== "01") {
                let r = step * Math.PI / 180;
                lat += (RADIUS * Math.cos(r) / LAT_M_PER_DEG);
                lon += (RADIUS * Math.sin(r) / (LAT_M_PER_DEG * Math.cos(center.lat * Math.PI / 180)));
            }
            gpx += `\n<wpt lat="${lat.toFixed(6)}" lon="${lon.toFixed(6)}"><name>M${String(i+1).padStart(2,'0')}.${sub+1}</name></wpt>`;
        });
    });
    return gpx + '\n</gpx>';
}

function copyFinalGPX() { navigator.clipboard.writeText(buildGPXString()).then(() => showToast("📋 已複製 GPX")); }
function downloadFinalGPX() {
    const blob = new Blob([buildGPXString()], {type: 'application/gpx+xml'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = `Suderpanda_v34_${Date.now()}.gpx`; a.click();
}
function showToast(msg) { const t = document.getElementById('toast'); t.innerText = msg; t.style.opacity = "1"; setTimeout(() => t.style.opacity = "0", 2000); }
</script>
</body>
</html>
