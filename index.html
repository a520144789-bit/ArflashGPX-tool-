<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Suderpanda GPX v3.9</title>
    <style>
        :root { --primary: #6c5ce7; --success: #00b894; --bg: #f8f9fa; }
        body { font-family: system-ui, sans-serif; background: var(--bg); padding: 15px; color: #2d3436; margin: 0; }
        .card { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: var(--primary); font-size: 18px; margin-bottom: 12px; }
        textarea { width: 100%; height: 80px; border: 2px solid #e2e8f0; border-radius: 12px; padding: 8px; box-sizing: border-box; font-size: 12px; margin-bottom: 10px; }
        
        .stats-panel { background: #f1f2f6; padding: 12px; border-radius: 15px; margin-bottom: 15px; display: flex; flex-direction: column; gap: 8px; }
        .stats-row { display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
        .stats-row b { color: var(--primary); font-size: 16px; }
        #speedInput { width: 50px; padding: 4px; border: 2px solid var(--primary); border-radius: 8px; text-align: center; font-weight: bold; outline: none; }

        .map-container { width: 100%; background: #1e272e; border-radius: 16px; margin-bottom: 15px; height: 320px; overflow: hidden; border: 1px solid #dcdde1; position: relative; }
        canvas { width: 100%; height: 100%; display: block; touch-action: none; user-select: none; }
        
        .btn-group { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 15px; }
        .btn-group-2 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 15px; }
        button { padding: 12px 2px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 13px; color: white; transition: 0.2s; }
        button:active { transform: scale(0.95); opacity: 0.8; }
        .btn-analyze { background: var(--success); }
        .btn-rotate { background: #e67e22; }
        .btn-copy { background: #0984e3; }
        .btn-download { background: var(--primary); }
        .btn-undo { background: #636e72; }
        .btn-redo { background: #636e72; }

        #sortableList { display: grid; grid-template-columns: repeat(auto-fill, minmax(50px, 1fr)); gap: 10px; padding: 0; margin: 0; }
        .sort-item { background: #fff; border: 2px solid #eee; height: 50px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: bold; color: var(--primary); list-style: none; cursor: grab; transition: 0.2s; }
        .sort-item.selected { border-color: var(--primary); background-color: #e0e0ff; box-shadow: 0 0 10px rgba(108, 92, 231, 0.3); }
        
        #toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); color: white; padding: 8px 20px; border-radius: 20px; font-size: 13px; opacity: 0; transition: 0.3s; z-index: 1000; pointer-events: none; }
    </style>
</head>
<body>

<div class="card">
    <h1>🐼 Suderpanda GPX maker v3.9 🐼 </h1>
    <textarea id="coordsInput" placeholder="在此貼上座標..."></textarea>

    <div class="stats-panel">
        <div class="stats-row">
            <span>載入中心點：<b id="pointCount">0</b></span>
            <div>設定時速：<input type="number" id="speedInput" value="19" oninput="updateStats()"> km/h</div>
        </div>
        <div class="stats-row" style="border-top: 1px solid #ddd; padding-top: 5px;">
            <span>預估路徑距離：<b id="totalDist">0.00</b> km</span>
            <span>預計耗時：<b id="totalTime">0</b> 分鐘</span>
        </div>
    </div>

    <div style="margin-bottom: 10px;">
        <label style="font-size: 13px; font-weight: bold; color: var(--primary);">輸出格式：</label>
        <select id="gpxFormat" style="width: 100%; padding: 8px; border-radius: 10px; border: 2px solid #e2e8f0; font-size: 13px;">
            <option value="arflash">ARflash (WPT)</option>
            <option value="joystick">JoyStick (TRK)</option>
            <option value="phantom">魅影 (WPT)</option>
            <option value="fakegps">Fake GPS (WPT)</option>
            <option value="ianygo">iAnyGo (TRK)</option>
        </select>
    </div>
    
    <div class="btn-group">
        <button class="btn-analyze" onclick="analyzePoints()">🔍 分析排序</button>
        <button class="btn-copy" onclick="copyToClipboard()">📋 複製GPX</button>
        <button class="btn-download" onclick="downloadFinalGPX()">💾 下載檔案</button>
         
    </div>

    <div class="btn-group-2">
        <button class="btn-rotate" onclick="rotateSelected()">🔄 旋轉組別</button>
        <button class="btn-undo" onclick="undo()">↩️ 撤銷 (Undo)</button>
        <button class="btn-redo" onclick="redo()">↪️ 重做 (Redo)</button>
    </div>

    <div class="map-container"><canvas id="mapCanvas"></canvas></div>
    <ul id="sortableList"></ul>
</div>

<div id="toast"></div>

<script>
// --- 全域變數 ---
let masterCenters = [];
let mapScale = 1;
let offsetX = 0; // 畫布 X 偏移
let offsetY = 0; // 畫布 Y 偏移
let isDragging = false; // 是否正在拖拽
let lastMouseX = 0;
let lastMouseY = 0;
let initialPinchDist = 0;
let initialScale = 1;
let selectedIndex = null;
let lastClickTime = 0;
let historyStack = [];
let redoStack = [];
const MAX_HISTORY = 30;
const RADIUS = 36, LAT_M_PER_DEG = 111132;
const RULES = { "NE_SE": [45, 315, "01", 225, 135], "NE_SW": [45, 315, "01", 135, 225], "NE_NW": [45, 135, "01", 225, 315], "NW_NE": [315, 225, "01", 135, 45], "NW_SE": [315, 45, "01", 225, 135], "NW_SW": [315, 45, "01", 135, 225], "SE_SW": [135, 45, "01", 315, 225], "SE_NW": [135, 225, "01", 45, 315], "SE_NE": [135, 225, "01", 315, 45], "SW_NW": [225, 135, "01", 45, 315], "SW_NE": [225, 135, "01", 315, 45], "SW_SE": [225, 315, "01", 45, 135] };

// --- 初始化與觸控縮放 ---
window.onload = () => {
    const canvas = document.getElementById('mapCanvas');
    
    // 觸控事件 (縮放 + 雙指拖拽)
    canvas.addEventListener('touchstart', (e) => {
        if (e.touches.length === 2) {
            initialPinchDist = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
            initialScale = mapScale;
        } else if (e.touches.length === 1) {
            isDragging = true;
            lastMouseX = e.touches[0].pageX;
            lastMouseY = e.touches[0].pageY;
        }
    });

    // 滑鼠滾輪縮放
    canvas.addEventListener('wheel', (e) => {
        e.preventDefault(); // 防止網頁跟著捲動
        
        const zoomSpeed = 0.001;
        const delta = -e.deltaY; // 向上滾是正值，向下是負值
        
        // 計算新的縮放值
        let newScale = mapScale + delta * zoomSpeed;
        
        // 限制縮放範圍在 0.5 到 8 倍之間
        mapScale = Math.min(Math.max(newScale, 0.5), 8);
        
        drawMap();
    }, { passive: false });
    
    canvas.addEventListener('touchmove', (e) => {
        e.preventDefault();
        if (e.touches.length === 2) {
            const currentDist = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
            mapScale = Math.min(Math.max(initialScale * (currentDist / initialPinchDist), 0.5), 8); 
            drawMap();
        } else if (e.touches.length === 1 && isDragging) {
            const dx = e.touches[0].pageX - lastMouseX;
            const dy = e.touches[0].pageY - lastMouseY;
            offsetX += dx / mapScale;
            offsetY += dy / mapScale;
            lastMouseX = e.touches[0].pageX;
            lastMouseY = e.touches[0].pageY;
            drawMap();
        }
    }, { passive: false });

    canvas.addEventListener('touchend', () => { isDragging = false; });

    // 滑鼠事件 (電腦端預覽用)
    canvas.addEventListener('mousedown', (e) => {
        isDragging = true;
        lastMouseX = e.clientX;
        lastMouseY = e.clientY;
    });
    window.addEventListener('mousemove', (e) => {
        if (isDragging) {
            const dx = e.clientX - lastMouseX;
            const dy = e.clientY - lastMouseY;
            offsetX += dx / mapScale;
            offsetY += dy / mapScale;
            lastMouseX = e.clientX;
            lastMouseY = e.clientY;
            drawMap();
        }
    });
    window.addEventListener('mouseup', () => { isDragging = false; });

    // 單擊與雙擊判定
    canvas.addEventListener('click', (e) => {
        const now = Date.now(), rect = canvas.getBoundingClientRect();
        const x = (e.clientX - rect.left);
        const y = (e.clientY - rect.top);
        if (now - lastClickTime < 300) handleMapDoubleClick(x, y);
        else handleMapSingleClick(x, y);
        lastClickTime = now;
    });
};

// --- 歷史紀錄 ---
function saveState() {
    const currentState = JSON.stringify(masterCenters);
    if (historyStack.length > 0 && historyStack[historyStack.length - 1] === currentState) return;
    historyStack.push(currentState);
    if (historyStack.length > MAX_HISTORY) historyStack.shift();
    redoStack = []; 
}

function undo() {
    if (historyStack.length <= 1) return showToast("已是最初狀態");
    redoStack.push(historyStack.pop());
    masterCenters = JSON.parse(historyStack[historyStack.length - 1]);
    selectedIndex = null;
    renderAll(true);
    showToast("已撤銷");
}

function redo() {
    if (redoStack.length === 0) return showToast("沒有可重做動作");
    const nextState = redoStack.pop();
    historyStack.push(nextState);
    masterCenters = JSON.parse(nextState);
    selectedIndex = null;
    renderAll(true);
    showToast("已重做");
}

function rotateSelected() {
    if (selectedIndex === null) return showToast("請先選中一個點位");
    saveState();
    masterCenters[selectedIndex].rotation = ((masterCenters[selectedIndex].rotation || 0) + 1) % 8;
    renderAll(true); 
    showToast(`點 #${selectedIndex + 1} 旋轉至 ${masterCenters[selectedIndex].rotation * 45}°`);
}

// --- TSP 與分析邏輯 ---
function splitToFour(pts) {
    if (pts.length === 0) return [[],[],[],[]];
    const lats = pts.map(p => p.lat), lons = pts.map(p => p.lon);
    const midLat = (Math.min(...lats) + Math.max(...lats)) / 2;
    const midLon = (Math.min(...lons) + Math.max(...lons)) / 2;
    let res = [[],[],[],[]]; 
    pts.forEach(p => {
        if (p.lat >= midLat && p.lon >= midLon) res[0].push(p);
        else if (p.lat >= midLat && p.lon < midLon) res[1].push(p);
        else if (p.lat < midLat && p.lon < midLon) res[2].push(p);
        else res[3].push(p);
    });
    return res;
}

function runTSP(points) {
    if (points.length <= 1) return [...points];
    let pool = [...points], ordered = [pool.splice(0, 1)[0]];
    while (pool.length > 0) {
        let best = 0, minDist = Infinity, last = ordered[ordered.length - 1];
        pool.forEach((p, i) => {
            let d = Math.pow(p.lat - last.lat, 2) + Math.pow(p.lon - last.lon, 2);
            if (d < minDist) { minDist = d; best = i; }
        });
        ordered.push(pool.splice(best, 1)[0]);
    }
    return ordered;
}

function extractSub(bigQuad, subIndices) {
    let subQuads = splitToFour(bigQuad);
    let extracted = [];
    subIndices.forEach(idx => { if (subQuads[idx].length > 0) extracted.push(...runTSP(subQuads[idx])); });
    return extracted;
}

function analyzePoints() {
    const input = document.getElementById('coordsInput').value.trim();
    let raw = [];
    input.split('\n').forEach(line => {
        let p = line.trim().split(/[,|\s\t]+/);
        if (p.length >= 2) {
            let lat = parseFloat(p[0]), lon = parseFloat(p[1]);
            if (!isNaN(lat) && !isNaN(lon)) raw.push({lat, lon, rotation: 0});
        }
    });
    if (raw.length === 0) return;
    raw = raw.filter((p, i, self) => i === self.findIndex(t => Math.abs(t.lat-p.lat)<1e-7 && Math.abs(t.lon-p.lon)<1e-7));
    let bigQuads = splitToFour(raw);
    let result = [];
    try {
        result.push(...extractSub(bigQuads[0], [3, 0, 1])); 
        result.push(...extractSub(bigQuads[1], [0, 1, 2])); 
        result.push(...extractSub(bigQuads[2], [1, 2, 3])); 
        result.push(...extractSub(bigQuads[3], [2, 3, 0])); 
        result.push(...extractSub(bigQuads[3], [1]));      
        result.push(...extractSub(bigQuads[2], [0]));
        result.push(...extractSub(bigQuads[1], [3]));
        result.push(...extractSub(bigQuads[0], [2]));
    } catch(e) {}
    masterCenters = result.length > 0 ? result : raw;
    mapScale = 1; // 重設縮放
    renderAll();
}

// --- 繪圖核心 ---
function drawMap() {
    const canvas = document.getElementById('mapCanvas');
    if (!canvas || masterCenters.length === 0) return;

    // 取得螢幕像素比 (通常為 2 或 3)
    const dpr = window.devicePixelRatio || 1; 
    const rect = canvas.getBoundingClientRect();

    // 設置物理像素大小
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;

    const ctx = canvas.getContext('2d'); // 只在這裡宣告一次 ctx
    
    // 縮放所有繪圖操作，讓座標系統回到邏輯像素大小
    ctx.scale(dpr, dpr);

    const w = rect.width;
    const h = rect.height;
// --- 結束適配 ---

    // 計算邊界
    const lats = masterCenters.map(p => p.lat), lons = masterCenters.map(p => p.lon);
    const minLat = Math.min(...lats), maxLat = Math.max(...lats);
    const minLon = Math.min(...lons), maxLon = Math.max(...lons);
    const lonModifier = Math.cos(lats[0] * Math.PI / 180);
    const latSpan = (maxLat - minLat) || 0.0001;
    const lonSpan = ((maxLon - minLon) * lonModifier) || 0.0001;
    const pad = 40;
    const scale = Math.min((w - pad * 2) / lonSpan, (h - pad * 2) / latSpan);

    // 繪製背景
    ctx.clearRect(0, 0, w, h);
    ctx.fillStyle = "#1e272e";
    ctx.fillRect(0, 0, w, h);

    // --- 開始縮放與平移畫布 ---
    ctx.save();
    ctx.translate(w / 2, h / 2);
    ctx.scale(mapScale, mapScale);
    // 加入移動偏移
    ctx.translate(offsetX, offsetY); 
    ctx.translate(-w / 2, -h / 2);

    const getX = (lon) => w / 2 + (lon - (minLon + maxLon) / 2) * lonModifier * scale;
    const getY = (lat) => h / 2 - (lat - (minLat + maxLat) / 2) * scale;

    // 1. 繪製組與組之間的連接紅色實線
    ctx.beginPath();
    ctx.strokeStyle = "#ff4757"; // 紅色實線
    ctx.lineWidth = 1.5;
    ctx.setLineDash([]); 
    masterCenters.forEach((p, i) => {
        const x = getX(p.lon), y = getY(p.lat);
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    });
    ctx.stroke();

    // 2. 循環繪製各組的子點與走線
    masterCenters.forEach((center, i) => {
        const x = getX(center.lon), y = getY(center.lat);
        const isSelected = (i === selectedIndex);

        // 取得 20 邏輯規則
        const prev = masterCenters[i > 0 ? i - 1 : masterCenters.length - 1];
        const next = masterCenters[i < masterCenters.length - 1 ? i + 1 : 0];
        const getQ = (c, t) => {
            let dL = t.lat - c.lat, dO = t.lon - c.lon;
            return (dL >= 0 && dO >= 0) ? "NE" : (dL >= 0 && dO < 0) ? "NW" : (dL < 0 && dO < 0) ? "SW" : "SE";
        };
        const baseRules = (RULES[`${getQ(center, prev)}_${getQ(center, next)}`] || [45, 135, "01", 225, 315]);
        const rot = (center.rotation || 0) * 45;

        const drawOrder = baseRules.map(step => {
            if (step === "01") return { x, y };
            const r = (step + rot) * Math.PI / 180;
            return {
                x: x + Math.sin(r) * 12,
                y: y - Math.cos(r) * 12
            };
        });

        // 繪製子點走線 (黃色實線)
        ctx.beginPath();
        ctx.strokeStyle = isSelected ? "#f1c40f" : "rgba(241, 196, 15, 0.6)";
        ctx.lineWidth = isSelected ? 2 : 1;
        ctx.setLineDash([]);
        drawOrder.forEach((pt, idx) => {
            if (idx === 0) ctx.moveTo(pt.x, pt.y);
            else ctx.lineTo(pt.x, pt.y);
        });
        ctx.stroke();

        // 繪製子點小圓點
        drawOrder.forEach(pt => {
            if (pt.x === x && pt.y === y) return;
            ctx.beginPath();
            ctx.arc(pt.x, pt.y, 2.5, 0, Math.PI * 2);
            ctx.fillStyle = isSelected ? "#f1c40f" : "rgba(255, 255, 255, 0.6)";
            ctx.fill();
        });

        // 繪製中心母點 (微型化)
        ctx.beginPath();
        ctx.arc(x, y, 3, 0, Math.PI * 2);
        ctx.fillStyle = isSelected ? "#e67e22" : (i === 0 ? "#00b894" : "rgba(108, 92, 231, 0.6)");
        ctx.fill();

        // --- 序號文字加上黑邊 ---
ctx.font = "bold 10px Arial";
ctx.textAlign = "center";

const text = i + 1;
const textX = x;
const textY = y + 3.5;

// 1. 設定黑邊寬度與顏色
ctx.strokeStyle = "black";
ctx.lineWidth = 3;         // 邊框粗細，可依喜好調整
ctx.lineJoin = "round";    // 讓邊角圓滑一點

// 2. 先畫邊框
ctx.strokeText(text, textX, textY);

// 3. 再填充白色文字（這樣白色才會蓋在黑邊上面）
ctx.fillStyle = "white";
ctx.fillText(text, textX, textY);

        // 選中狀態的外圈
        if (isSelected) {
            ctx.beginPath();
            ctx.arc(x, y, 10, 0, Math.PI * 2);
            ctx.strokeStyle = "rgba(253, 203, 110, 0.8)";
            ctx.lineWidth = 1;
            ctx.stroke();
        }
    });

    ctx.restore();
}

// --- 其他功能 ---
function handleMapSingleClick(x, y) {
    const canvas = document.getElementById('mapCanvas');
    const dpr = window.devicePixelRatio || 1;
    
    // 取得畫布邏輯寬高 (CSS size)
    const w = canvas.width / dpr;
    const h = canvas.height / dpr;

    /**
     * 座標逆運算邏輯：
     * 1. 減去中心偏移 (w/2, h/2)
     * 2. 除以縮放倍率 mapScale
     * 3. 減去平移偏移 offsetX/offsetY
     * 4. 加回中心偏移
     */
    const realX = (x - w / 2) / mapScale - offsetX + w / 2;
    const realY = (y - h / 2) / mapScale - offsetY + h / 2;

    let clickedIdx = -1;
    // 判定範圍隨縮放調整：放大時判定半徑變小，避免誤觸
    const touchRadius = 22 / mapScale > 10 ? 22 / mapScale : 10; 

    for (let i = 0; i < masterCenters.length; i++) {
        if (getDistToPoint(i, realX, realY) < touchRadius) { 
            clickedIdx = i; 
            break; 
        }
    }

    if (clickedIdx !== -1) {
        if (selectedIndex === null) { 
            selectedIndex = clickedIdx; 
            showToast(`選中 #${clickedIdx + 1}`); 
        } else if (selectedIndex === clickedIdx) { 
            selectedIndex = null; 
        } else {
            saveState();
            const item = masterCenters.splice(selectedIndex, 1)[0];
            masterCenters.splice(clickedIdx, 0, item);
            selectedIndex = null;
            renderAll(true);
        }
        drawMap();
    } else { 
        selectedIndex = null; 
        drawMap(); 
    }
}

function getDistToPoint(idx, realX, realY) {
    const canvas = document.getElementById('mapCanvas');
    const w = canvas.width / (window.devicePixelRatio || 1);
    const h = canvas.height / (window.devicePixelRatio || 1);

    // 重新取得計算座標所需的變數（與 drawMap 邏輯一致）
    const lats = masterCenters.map(p => p.lat), lons = masterCenters.map(p => p.lon);
    const minLat = Math.min(...lats), maxLat = Math.max(...lats);
    const minLon = Math.min(...lons), maxLon = Math.max(...lons);
    const lonModifier = Math.cos(lats[0] * Math.PI / 180);
    
    const pad = 40;
    const scale = Math.min((w - pad * 2) / (((maxLon - minLon) * lonModifier) || 0.0001), (h - pad * 2) / ((maxLat - minLat) || 0.0001));

    // 這是該點在畫布上的「邏輯座標」
    const tx = w / 2 + (masterCenters[idx].lon - (minLon + maxLon) / 2) * lonModifier * scale;
    const ty = h / 2 - (masterCenters[idx].lat - (minLat + maxLat) / 2) * scale;

    return Math.hypot(tx - realX, ty - realY);
}

function handleMapDoubleClick(x, y) { /* 保留原本邏輯 */ }

function renderList() {
    const list = document.getElementById('sortableList');
    list.innerHTML = ""; 
    masterCenters.forEach((p, i) => {
        const li = document.createElement('li');
        li.className = 'sort-item' + (selectedIndex === i ? ' selected' : '');
        li.innerText = i + 1;
        li.onclick = () => { selectedIndex = (selectedIndex === i) ? null : i; renderAll(true); };
        list.appendChild(li);
    });
}

function updateStats() {
    const speed = parseFloat(document.getElementById('speedInput').value) || 19;
    document.getElementById('pointCount').innerText = masterCenters.length;
    const steps = getAllSteps();
    let dist = 0;
    for (let i = 1; i < steps.length; i++) {
        const dLat = (steps[i].lat - steps[i-1].lat) * LAT_M_PER_DEG;
        const dLon = (steps[i].lon - steps[i-1].lon) * LAT_M_PER_DEG * Math.cos(steps[i].lat * Math.PI / 180);
        dist += Math.hypot(dLat, dLon);
    }
    const km = dist / 1000;
    document.getElementById('totalDist').innerText = km.toFixed(2);
    document.getElementById('totalTime').innerText = Math.round((km / speed) * 60);
}

function getAllSteps() {
    let allSteps = [];
    const getQ = (c, t) => { let dL = t.lat - c.lat, dO = t.lon - c.lon; return (dL>=0 && dO>=0)?"NE":(dL>=0 && dO<0)?"NW":(dL<0 && dO<0)?"SW":"SE"; };
    masterCenters.forEach((center, i) => {
        let prev = masterCenters[i > 0 ? i - 1 : masterCenters.length - 1];
        let next = masterCenters[i < masterCenters.length - 1 ? i + 1 : 0];
        let baseRules = (RULES[`${getQ(center, prev)}_${getQ(center, next)}`] || [45, 135, "01", 225, 315]);
        let rot = (center.rotation || 0) * 45;
        baseRules.forEach((step, sub) => {
            let lat = center.lat, lon = center.lon;
            if (step !== "01") {
                let r = (step + rot) * Math.PI / 180;
                lat += (RADIUS * Math.cos(r) / LAT_M_PER_DEG);
                lon += (RADIUS * Math.sin(r) / (LAT_M_PER_DEG * Math.cos(center.lat * Math.PI / 180)));
            }
            allSteps.push({ lat, lon, name: `M${String(i + 1).padStart(2, '0')}.${sub + 1}` });
        });
    });
    return allSteps;
}

function renderAll(skipSave = false) {
    if (!skipSave) saveState();
    renderList();
    drawMap();
    updateStats();
}

function buildGPXString() {
    const format = document.getElementById('gpxFormat').value;
    const steps = getAllSteps();
    let gpx = `<?xml version="1.0" encoding="UTF-8"?><gpx version="1.1" creator="Suderpanda">`;
    if (format === 'joystick' || format === 'ianygo') {
        gpx += `<trk><trkseg>`;
        steps.forEach(p => { gpx += `<trkpt lat="${p.lat.toFixed(6)}" lon="${p.lon.toFixed(6)}"></trkpt>`; });
        gpx += `</trkseg></trk>`;
    } else {
        steps.forEach(p => { gpx += `<wpt lat="${p.lat.toFixed(6)}" lon="${p.lon.toFixed(6)}"><name>${p.name}</name></wpt>`; });
    }
    return gpx + '</gpx>';
}

function downloadFinalGPX() {
    const gpx = buildGPXString();
    const blob = new Blob([gpx], { type: 'application/gpx+xml' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `Suderpanda_${Date.now()}.gpx`;
    a.click();
}

function copyToClipboard() {
    const gpx = buildGPXString();
    navigator.clipboard.writeText(gpx).then(() => showToast("✅ 已複製 GPX")).catch(() => showToast("❌ 複製失敗"));
}

function showToast(msg) { const t = document.getElementById('toast'); t.innerText = msg; t.style.opacity = "1"; setTimeout(() => t.style.opacity = "0", 2000); }
</script>
