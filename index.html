<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Suderpanda GPX v4.2</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐼</text></svg>">
    
    <style>
        :root { --primary: #6c5ce7; --success: #00b894; --warning: #e67e22; --danger: #d35400; --bg: #f8f9fa; }
        body { font-family: system-ui, sans-serif; background: var(--bg); padding: 15px; color: #2d3436; margin: 0; }
        .card { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); margin-bottom: 20px; }
        h1 { text-align: center; color: var(--primary); font-size: 18px; margin-bottom: 12px; }
        textarea { width: 100%; height: 80px; border: 2px solid #e2e8f0; border-radius: 12px; padding: 8px; box-sizing: border-box; font-size: 12px; margin-bottom: 10px; }
        
        .stats-panel { background: #f1f2f6; padding: 12px; border-radius: 15px; margin-bottom: 15px; display: flex; flex-direction: column; gap: 8px; }
        .stats-row { display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
        .stats-row b { color: var(--primary); font-size: 16px; }
        #speedInput { width: 50px; padding: 4px; border: 2px solid var(--primary); border-radius: 8px; text-align: center; font-weight: bold; outline: none; }

        .map-container { width: 100%; background: #1e272e; border-radius: 16px; margin-bottom: 15px; height: 320px; overflow: hidden; border: 1px solid #dcdde1; position: relative; }
        canvas { width: 100%; height: 100%; display: block; touch-action: none; user-select: none; }
        
        .btn-group { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 10px; }
        button { padding: 12px 2px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 13px; color: white; transition: 0.2s; }
        button:active { transform: scale(0.95); opacity: 0.8; }

        .btn-analyze { background: var(--success); }
        .btn-rotate { background: var(--warning); }
        .btn-copy { background: #0984e3; }
        .btn-download { background: var(--primary); }
        .btn-undo, .btn-redo { background: #636e72; }

        .jump-section { border: 2px dashed var(--danger); padding: 10px; border-radius: 12px; margin-top: 10px; }
        select { width: 100%; padding: 8px; border-radius: 10px; border: 2px solid #e2e8f0; font-size: 13px; margin-bottom: 8px; }

        #sortableList { display: grid; grid-template-columns: repeat(auto-fill, minmax(50px, 1fr)); gap: 10px; padding: 0; margin: 0; }
        .sort-item { background: #fff; border: 2px solid #eee; height: 50px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: bold; color: var(--primary); list-style: none; cursor: grab; }
        .sort-item.selected { border-color: var(--primary); background-color: #e0e0ff; }
        
        #toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); color: white; padding: 8px 20px; border-radius: 20px; font-size: 13px; opacity: 0; transition: 0.3s; z-index: 1000; pointer-events: none; }
    </style>
</head>
<body>

<div class="card">
    <h1>🐼 Suderpanda GPX maker v4.2 🐼</h1>
    <textarea id="coordsInput" placeholder="在此貼上座標..."></textarea>

    <div class="stats-panel">
        <div class="stats-row">
            <span>載入中心點：<b id="pointCount">0</b></span>
            <div>設定時速：<input type="number" id="speedInput" value="19" oninput="updateStats()"> km/h</div>
        </div>
        <div class="stats-row" style="border-top: 1px solid #ddd; padding-top: 5px;">
            <span>預估路徑距離：<b id="totalDist">0.00</b> km</span>
            <span>預計耗時：<b id="totalTime">0</b> 分鐘</span>
        </div>
    </div>

    <div style="margin-bottom: 10px;">
        <label style="font-size: 13px; font-weight: bold; color: var(--primary);">輸出格式：</label>
        <select id="gpxFormat">
            <option value="arflash">ARflash (WPT)</option>
            <option value="joystick">JoyStick (TRK)</option>
            <option value="phantom">魅影 (WPT)</option>
            <option value="fakegps">Fake GPS (WPT)</option>
            <option value="ianygo">iAnyGo (TRK)</option>
        </select>
    </div>
    
    <div class="btn-group">
        <button class="btn-analyze" onclick="analyzePoints()">🔍 分析排序</button>
        <button class="btn-copy" onclick="copyToClipboard()">📋 複製GPX</button>
        <button class="btn-download" onclick="downloadFinalGPX()">💾 下載檔案</button>
    </div>

    <div class="btn-group">
        <button class="btn-rotate" onclick="rotateSelected()">🔄 旋轉組別</button>
        <button class="btn-undo" onclick="undo()">↩️ 撤銷 (Undo)</button>
        <button class="btn-redo" onclick="redo()">↪️ 重做 (Redo)</button>
    </div>

    <div class="map-container"><canvas id="mapCanvas"></canvas></div>
    <ul id="sortableList"></ul>
</div>

<div class="jump-section">
    <label style="font-size: 13px; font-weight: bold; color: var(--danger);">⚡ 跳躍採收轉換器：</label>
    
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px;">
        <textarea id="jumpInput" style="height: 120px;" placeholder="[輸入] 貼入或導入座標..."></textarea>
        <textarea id="randomResult" style="height: 120px; background: #f0fdf4;" readonly placeholder="[結果] 30m 隨機化座標..."></textarea>
    </div>

    <div class="btn-group" style="grid-template-columns: 1fr 1fr; margin-bottom: 8px;">
        <button style="background: #27ae60; font-size: 11px;" onclick="importFrom('harvest')">📥 從隨機區導入</button>
        <button style="background: #2980b9; font-size: 11px;" onclick="importFrom('original')">📥 從原始區導入</button>
    </div>

    <select id="jumpGpxFormat">
        <option value="arflash">ARflash (WPT)</option>
        <option value="joystick">JoyStick (TRK)</option>
        <option value="phantom">魅影 (WPT)</option>
        <option value="fakegps">Fake GPS (WPT)</option>
        <option value="ianygo">iAnyGo (TRK)</option>
    </select>
    
    <div class="btn-group" style="grid-template-columns: 1fr 1fr; margin-bottom: 8px;">
        <button style="background: #a29bfe; color: #2d3436;" onclick="transformToRandom()">🎲 轉換隨機座標</button>
        <button style="background: var(--danger);" onclick="downloadJumpGPX()">💾 下載跳躍GPX</button>
    </div>
    <button style="background: #0984e3; width: 100%; padding: 12px; border-radius: 10px;" onclick="copyJumpGPX()">📋 複製跳躍GPX</button>
</div>
<div id="toast"></div>

<script>
// --- 全域變數與規則 (保持不變) ---
let masterCenters = [];
let mapScale = 1; let offsetX = 0; let offsetY = 0;
let isDragging = false; let lastMouseX = 0; let lastMouseY = 0;
let initialPinchDist = 0; let initialScale = 1;
let selectedIndex = null; let lastClickTime = 0;
let historyStack = []; let redoStack = [];
const MAX_HISTORY = 30; const RADIUS = 36; const LAT_M_PER_DEG = 111132;
const RULES = { "NE_SE": [45, 315, "01", 225, 135], "NE_SW": [45, 315, "01", 135, 225], "NE_NW": [45, 135, "01", 225, 315], "NW_NE": [315, 225, "01", 135, 45], "NW_SE": [315, 45, "01", 225, 135], "NW_SW": [315, 45, "01", 135, 225], "SE_SW": [135, 45, "01", 315, 225], "SE_NW": [135, 225, "01", 45, 315], "SE_NE": [135, 225, "01", 315, 45], "SW_NW": [225, 135, "01", 45, 315], "SW_NE": [225, 135, "01", 315, 45], "SW_SE": [225, 315, "01", 45, 135] };

window.onload = () => {
    const canvas = document.getElementById('mapCanvas');
    canvas.addEventListener('touchstart', (e) => { if (e.touches.length === 2) { initialPinchDist = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY); initialScale = mapScale; } else if (e.touches.length === 1) { isDragging = true; lastMouseX = e.touches[0].pageX; lastMouseY = e.touches[0].pageY; } });
    canvas.addEventListener('wheel', (e) => { e.preventDefault(); let newScale = mapScale + (-e.deltaY) * 0.001; mapScale = Math.min(Math.max(newScale, 0.5), 8); drawMap(); }, { passive: false });
    canvas.addEventListener('touchmove', (e) => { e.preventDefault(); if (e.touches.length === 2) { const currentDist = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY); mapScale = Math.min(Math.max(initialScale * (currentDist / initialPinchDist), 0.5), 8); drawMap(); } else if (e.touches.length === 1 && isDragging) { offsetX += (e.touches[0].pageX - lastMouseX) / mapScale; offsetY += (e.touches[0].pageY - lastMouseY) / mapScale; lastMouseX = e.touches[0].pageX; lastMouseY = e.touches[0].pageY; drawMap(); } }, { passive: false });
    canvas.addEventListener('touchend', () => { isDragging = false; });
    canvas.addEventListener('mousedown', (e) => { isDragging = true; lastMouseX = e.clientX; lastMouseY = e.clientY; });
    window.addEventListener('mousemove', (e) => { if (isDragging) { offsetX += (e.clientX - lastMouseX) / mapScale; offsetY += (e.clientY - lastMouseY) / mapScale; lastMouseX = e.clientX; lastMouseY = e.clientY; drawMap(); } });
    window.addEventListener('mouseup', () => { isDragging = false; });
    canvas.addEventListener('click', (e) => { const now = Date.now(), rect = canvas.getBoundingClientRect(); const x = (e.clientX - rect.left), y = (e.clientY - rect.top); if (now - lastClickTime < 300) handleMapDoubleClick(x, y); else handleMapSingleClick(x, y); lastClickTime = now; });
};

// --- 完全按照 ARflash 原始檔案寫法 (不添加額外優化) ---
function generateGPX(points, format) {
    let gpx = `<?xml version="1.0" encoding="UTF-8"?>\n<gpx version="1.1" creator="suder-gpx">`;
    
    // 加入範例中的 metadata
    const firstPt = points.length > 0 ? points[0] : {lat:0, lon:0};
    const now = new Date();
    const dateStr = (now.getMonth()+1).toString().padStart(2,'0') + now.getDate().toString().padStart(2,'0') + "_" + now.getHours().toString().padStart(2,'0') + now.getMinutes().toString().padStart(2,'0');
    gpx += `\n  <metadata><name>Suderpanda_${dateStr}_(${firstPt.lat.toFixed(2)},${firstPt.lon.toFixed(2)})</name></metadata>`;

    if (format === 'joystick' || format === 'ianygo') {
        gpx += `\n  <trk><trkseg>`;
        points.forEach(p => {
            gpx += `\n    <trkpt lat="${p.lat.toFixed(7)}" lon="${p.lon.toFixed(7)}"></trkpt>`;
        });
        gpx += `\n  </trkseg></trk>`;
    } else {
        points.forEach((p, i) => {
            // 完全照搬範例中的 <wpt> 格式
            gpx += `\n  <wpt lat="${p.lat.toFixed(7)}" lon="${p.lon.toFixed(7)}"><name>${p.name || 'P'+(i+1)}</name></wpt>`;
        });
    }
    gpx += `\n</gpx>`;
    return gpx;
}

// --- 修正後的下載與複製函數 ---
function buildGPXString() {
    const fmt = document.getElementById('gpxFormat').value;
    const steps = getAllSteps();
    return generateGPX(steps, fmt);
}

function downloadJumpGPX() {
    const pts = getJumpPoints();
    if (pts.length === 0) return showToast("請先生成隨機點位");
    const fmt = document.getElementById('jumpGpxFormat').value;
    const gpx = generateGPX(pts, fmt);
    const blob = new Blob([gpx], { type: 'application/gpx+xml' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `JumpHarvest_${Date.now()}.gpx`;
    a.click();
}

// --- 其他原有功能函數 (保持不變) ---
function getJumpPoints() {
    const rawText = document.getElementById('harvestDisplay').value.trim();
    if (!rawText) return [];
    let jumpPoints = [];
    const lines = rawText.split('\n');
    lines.forEach((line, index) => {
        const parts = line.split(',');
        if (parts.length >= 2) {
            const lat = parseFloat(parts[0]); const lon = parseFloat(parts[1]);
            const lonOffset = 2.5 / (LAT_M_PER_DEG * Math.cos(lat * Math.PI / 180));
            jumpPoints.push({ lat: lat, lon: lon - lonOffset, name: `J${index+1}W` });
            jumpPoints.push({ lat: lat, lon: lon + lonOffset, name: `J${index+1}E` });
        }
    });
    return jumpPoints;
}
function copyJumpHarvestText() {
    const pts = getJumpPoints();
    if (pts.length === 0) return showToast("請先生成隨機點位");
    const text = pts.map(p => `${p.lat.toFixed(6)},${p.lon.toFixed(6)}`).join('\n');
    navigator.clipboard.writeText(text).then(() => showToast("📋 跳躍座標已複製"));
}

    // 導入功能：從指定來源抓取資料
function importFrom(source) {
    const sourceId = (source === 'harvest') ? 'harvestDisplay' : 'coordsInput';
    const content = document.getElementById(sourceId).value.trim();
    
    if (!content) {
        return showToast(source === 'harvest' ? "隨機區目前沒有座標" : "原始輸入區目前沒有座標");
    }
    
    document.getElementById('jumpInput').value = content;
    showToast(`✅ 已從${source === 'harvest' ? '隨機區' : '原始區'}導入`);
}

// 修改獲取點位的邏輯：現在只認 jumpInput
function getJumpPoints() {
    const sourceText = document.getElementById('randomResult').value.trim() || 
                       document.getElementById('jumpInput').value.trim();
    
    if (!sourceText) return [];
    
    let jumpPoints = [];
    const lines = sourceText.split('\n');
    lines.forEach((line, index) => {
        const parts = line.trim().split(/[,|\s\t]+/);
        if (parts.length >= 2) {
            const lat = parseFloat(parts[0]);
            const lon = parseFloat(parts[1]);
            if (!isNaN(lat) && !isNaN(lon)) {
                const lonOffset = 2.5 / (LAT_M_PER_DEG * Math.cos(lat * Math.PI / 180));
                jumpPoints.push({ lat: lat, lon: lon - lonOffset, name: `J${index+1}W` });
                jumpPoints.push({ lat: lat, lon: lon + lonOffset, name: `J${index+1}E` });
            }
        }
    });
    return jumpPoints;
}
    // 新增：將輸入區的座標轉換為 30m 內的隨機點並顯示在右側
function transformToRandom() {
    const rawText = document.getElementById('jumpInput').value.trim();
    if (!rawText) return showToast("請先導入或輸入座標");

    let randomizedList = [];
    const lines = rawText.split('\n');
    
    lines.forEach(line => {
        const parts = line.trim().split(/[,|\s\t]+/);
        if (parts.length >= 2) {
            const lat = parseFloat(parts[0]);
            const lon = parseFloat(parts[1]);
            if (!isNaN(lat) && !isNaN(lon)) {
                // 產生 30 公尺內的隨機偏移
                const angle = Math.random() * Math.PI * 2;
                const dist = Math.sqrt(Math.random()) * 30; // 0~30公尺
                const oLat = (dist * Math.cos(angle)) / LAT_M_PER_DEG;
                const oLon = (dist * Math.sin(angle)) / (LAT_M_PER_DEG * Math.cos(lat * Math.PI / 180));
                randomizedList.push(`${(lat + oLat).toFixed(6)},${(lon + oLon).toFixed(6)}`);
            }
        }
    });

    document.getElementById('randomResult').value = randomizedList.join('\n');
    showToast("🎲 已完成 30m 隨機化轉換");
}
    // 複製跳躍 GPX 的功能
function copyJumpGPX() {
    const pts = getJumpPoints();
    if (pts.length === 0) return showToast("請先生成隨機點位");
    
    // 獲取跳躍區塊專屬的格式選單值
    const fmt = document.getElementById('jumpGpxFormat').value;
    const gpx = generateGPX(pts, fmt);
    
    navigator.clipboard.writeText(gpx).then(() => {
        showToast("✅ 已依選定格式複製跳躍 GPX");
    }).catch(err => {
        showToast("❌ 複製失敗");
    });
}
function saveState() { const currentState = JSON.stringify(masterCenters); if (historyStack.length > 0 && historyStack[historyStack.length - 1] === currentState) return; historyStack.push(currentState); if (historyStack.length > MAX_HISTORY) historyStack.shift(); redoStack = []; }
function undo() { if (historyStack.length <= 1) return showToast("已是最初狀態"); redoStack.push(historyStack.pop()); masterCenters = JSON.parse(historyStack[historyStack.length - 1]); selectedIndex = null; renderAll(true); }
function redo() { if (redoStack.length === 0) return showToast("沒有可重做動作"); const nextState = redoStack.pop(); historyStack.push(nextState); masterCenters = JSON.parse(nextState); selectedIndex = null; renderAll(true); }
function rotateSelected() { if (selectedIndex === null) return showToast("請先選中一個點位"); saveState(); masterCenters[selectedIndex].rotation = ((masterCenters[selectedIndex].rotation || 0) + 1) % 8; renderAll(true); }
function analyzePoints() { const input = document.getElementById('coordsInput').value.trim(); if (!input) return; let raw = []; input.split('\n').forEach(line => { let p = line.trim().split(/[,|\s\t]+/); if (p.length >= 2) { let lat = parseFloat(p[0]), lon = parseFloat(p[1]); if (!isNaN(lat) && !isNaN(lon)) raw.push({lat, lon, rotation: 0}); } }); if (raw.length === 0) return; raw = raw.filter((p, i, self) => i === self.findIndex(t => Math.abs(t.lat-p.lat)<1e-7 && Math.abs(t.lon-p.lon)<1e-7)); masterCenters = raw; historyStack = [JSON.stringify(masterCenters)]; redoStack = []; mapScale = 1; offsetX = 0; offsetY = 0; selectedIndex = null; renderAll(true); showToast("分析完成"); }
function drawMap() { const canvas = document.getElementById('mapCanvas'); if (!canvas || masterCenters.length === 0) return; const dpr = window.devicePixelRatio || 1, rect = canvas.getBoundingClientRect(); canvas.width = rect.width * dpr; canvas.height = rect.height * dpr; const ctx = canvas.getContext('2d'); ctx.scale(dpr, dpr); const w = rect.width, h = rect.height; const lats = masterCenters.map(p => p.lat), lons = masterCenters.map(p => p.lon); const minLat = Math.min(...lats), maxLat = Math.max(...lats), minLon = Math.min(...lons), maxLon = Math.max(...lons); const lonMod = Math.cos(lats[0] * Math.PI / 180); const scale = Math.min((w-80)/(((maxLon-minLon)*lonMod)||0.0001), (h-80)/((maxLat-minLat)||0.0001)); ctx.clearRect(0,0,w,h); ctx.fillStyle="#1e272e"; ctx.fillRect(0,0,w,h); ctx.save(); ctx.translate(w/2, h/2); ctx.scale(mapScale, mapScale); ctx.translate(offsetX, offsetY); ctx.translate(-w/2, -h/2); const getX = (lon) => w/2 + (lon - (minLon+maxLon)/2) * lonMod * scale; const getY = (lat) => h/2 - (lat - (minLat+maxLat)/2) * scale; ctx.beginPath(); ctx.strokeStyle="#ff4757"; ctx.lineWidth=1.5; masterCenters.forEach((p, i) => { if(i===0) ctx.moveTo(getX(p.lon), getY(p.lat)); else ctx.lineTo(getX(p.lon), getY(p.lat)); }); ctx.stroke(); masterCenters.forEach((center, i) => { const x = getX(center.lon), y = getY(center.lat), isS = (i === selectedIndex); const prev = masterCenters[i>0?i-1:masterCenters.length-1], next = masterCenters[i<masterCenters.length-1?i+1:0]; const getQ = (c,t) => { let dL=t.lat-c.lat, dO=t.lon-c.lon; return (dL>=0&&dO>=0)?"NE":(dL>=0&&dO<0)?"NW":(dL<0&&dO<0)?"SW":"SE"; }; const base = (RULES[`${getQ(center,prev)}_${getQ(center,next)}`] || [45,135,"01",225,315]); const rot = (center.rotation||0)*45; const pts = base.map(s => { if(s==="01") return {x,y}; let r = (s+rot)*Math.PI/180; return { x: x+Math.sin(r)*12, y: y-Math.cos(r)*12 }; }); ctx.beginPath(); ctx.strokeStyle = isS?"#f1c40f":"rgba(241,196,15,0.6)"; ctx.lineWidth=isS?2:1; pts.forEach((p,idx)=>{ if(idx===0) ctx.moveTo(p.x,p.y); else ctx.lineTo(p.x,p.y); }); ctx.stroke(); pts.forEach(p => { if(p.x===x && p.y===y) return; ctx.beginPath(); ctx.arc(p.x,p.y,2.5,0,Math.PI*2); ctx.fillStyle=isS?"#f1c40f":"rgba(255,255,255,0.6)"; ctx.fill(); }); ctx.beginPath(); ctx.arc(x,y,3,0,Math.PI*2); ctx.fillStyle=isS?"#e67e22":(i===0?"#00b894":"rgba(108,92,231,0.6)"); ctx.fill(); ctx.font="bold 10px Arial"; ctx.textAlign="center"; ctx.strokeStyle="black"; ctx.lineWidth=3; ctx.strokeText(i+1, x, y+3.5); ctx.fillStyle="white"; ctx.fillText(i+1, x, y+3.5); }); ctx.restore(); }
function handleMapSingleClick(x,y) { const rect = document.getElementById('mapCanvas').getBoundingClientRect(); const w = rect.width, h = rect.height; const rx = (x - w/2)/mapScale - offsetX + w/2, ry = (y - h/2)/mapScale - offsetY + h/2; let clickIdx = -1; for(let i=0; i<masterCenters.length; i++) { if(getDistToPoint(i, rx, ry) < 22/mapScale) { clickIdx = i; break; } } if(clickIdx !== -1) { if(selectedIndex === null) selectedIndex = clickIdx; else if(selectedIndex === clickIdx) selectedIndex = null; else { saveState(); let it = masterCenters.splice(selectedIndex, 1)[0]; masterCenters.splice(clickIdx, 0, it); selectedIndex = null; renderAll(true); } drawMap(); } else { selectedIndex = null; drawMap(); } }
function getDistToPoint(idx, rx, ry) { const rect = document.getElementById('mapCanvas').getBoundingClientRect(); const w = rect.width, h = rect.height, lats = masterCenters.map(p => p.lat), lons = masterCenters.map(p => p.lon); const minLat = Math.min(...lats), maxLat = Math.max(...lats), minLon = Math.min(...lons), maxLon = Math.max(...lons); const lonMod = Math.cos(lats[0]*Math.PI/180), scale = Math.min((w-80)/(((maxLon-minLon)*lonMod)||0.0001), (h-80)/((maxLat-minLat)||0.0001)); const tx = w/2 + (masterCenters[idx].lon - (minLon+maxLon)/2) * lonMod * scale; const ty = h/2 - (masterCenters[idx].lat - (minLat+maxLat)/2) * scale; return Math.hypot(tx-rx, ty-ry); }
function renderList() { const list = document.getElementById('sortableList'); list.innerHTML = ""; masterCenters.forEach((p,i) => { const li = document.createElement('li'); li.className = 'sort-item'+(selectedIndex===i?' selected':''); li.innerText = i+1; li.onclick = () => { if(selectedIndex === null) selectedIndex = i; else if(selectedIndex === i) selectedIndex = null; else { saveState(); let it = masterCenters.splice(selectedIndex, 1)[0]; masterCenters.splice(i, 0, it); selectedIndex = null; } renderAll(true); }; list.appendChild(li); }); }
function updateStats() { const speed = parseFloat(document.getElementById('speedInput').value) || 19; document.getElementById('pointCount').innerText = masterCenters.length; const steps = getAllSteps(); let dist = 0; for (let i = 1; i < steps.length; i++) { const dLat = (steps[i].lat - steps[i-1].lat) * LAT_M_PER_DEG; const dLon = (steps[i].lon - steps[i-1].lon) * LAT_M_PER_DEG * Math.cos(steps[i].lat * Math.PI / 180); dist += Math.hypot(dLat, dLon); } const km = dist/1000; document.getElementById('totalDist').innerText = km.toFixed(2); document.getElementById('totalTime').innerText = Math.round((km/speed)*60); }
function getAllSteps() { let all = []; masterCenters.forEach((c, i) => { let prev = masterCenters[i>0?i-1:masterCenters.length-1], next = masterCenters[i<masterCenters.length-1?i+1:0]; const getQ = (c,t) => { let dL=t.lat-c.lat, dO=t.lon-c.lon; return (dL>=0&&dO>=0)?"NE":(dL>=0&&dO<0)?"NW":(dL<0&&dO<0)?"SW":"SE"; }; let base = (RULES[`${getQ(c,prev)}_${getQ(c,next)}`] || [45,135,"01",225,315]), rot = (c.rotation||0)*45; base.forEach((s, sub) => { let lat = c.lat, lon = c.lon; if(s!=="01") { let r = (s+rot)*Math.PI/180; lat += (RADIUS*Math.cos(r)/LAT_M_PER_DEG); lon += (RADIUS*Math.sin(r)/(LAT_M_PER_DEG*Math.cos(c.lat*Math.PI/180))); } all.push({lat, lon, name:`M${String(i+1).padStart(2,'0')}.${sub+1}`}); }); }); return all; }
function renderAll(skip = false) { if(!skip) saveState(); renderList(); drawMap(); updateStats(); }
function downloadFinalGPX() { const blob = new Blob([buildGPXString()], { type: 'application/gpx+xml' }); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `Suderpanda_${Date.now()}.gpx`; a.click(); }
function copyToClipboard() { navigator.clipboard.writeText(buildGPXString()).then(() => showToast("✅ 已複製 GPX")); }
function generateHarvestPoints() { if (masterCenters.length === 0) return showToast("請先分析並載入中心點位"); let list = []; masterCenters.forEach((center) => { const angle = Math.random() * Math.PI * 2; const dist = Math.sqrt(Math.random()) * 40; const oLat = (dist * Math.cos(angle)) / LAT_M_PER_DEG; const oLon = (dist * Math.sin(angle)) / (LAT_M_PER_DEG * Math.cos(center.lat * Math.PI / 180)); list.push(`${(center.lat + oLat).toFixed(6)},${(center.lon + oLon).toFixed(6)}`); }); document.getElementById('harvestDisplay').value = list.join('\n'); showToast(`✅ 已生成 ${list.length} 組隨機點`); }
function copyHarvestText() { const t = document.getElementById('harvestDisplay').value; if (!t) return showToast("無座標可複製"); navigator.clipboard.writeText(t).then(() => showToast("📋 原始座標已複製")); }
function showToast(msg) { const t = document.getElementById('toast'); t.innerText = msg; t.style.opacity = "1"; setTimeout(() => t.style.opacity = "0", 2000); }
</script>
