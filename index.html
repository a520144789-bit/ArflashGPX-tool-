<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPX 邏輯生成器 Pro</title>
    <style>
        :root { --primary: #007aff; --success: #34c759; }
        body { font-family: -apple-system, system-ui; background: #f0f2f5; margin: 0; padding: 20px; color: #1c1e21; }
        .card { max-width: 800px; margin: auto; background: white; padding: 25px; border-radius: 20px; box-shadow: 0 8px 30px rgba(0,0,0,0.1); }
        h2 { margin-top: 0; color: var(--primary); }
        .input-group { margin-bottom: 20px; }
        label { display: block; font-weight: 600; margin-bottom: 8px; font-size: 14px; }
        textarea { width: 100%; height: 180px; border: 2px solid #ddd; border-radius: 12px; padding: 15px; font-family: monospace; box-sizing: border-box; }
        .speed-input { width: 100px; padding: 10px; border: 2px solid #ddd; border-radius: 8px; font-size: 16px; }
        .stats-box { background: #f8f9fa; border-radius: 12px; padding: 15px; margin-top: 20px; display: none; border: 1px solid #eee; }
        .stats-item { font-size: 15px; margin-bottom: 5px; }
        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        button { padding: 16px; border: none; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .btn-main { background: var(--primary); color: white; }
        .btn-copy { background: #8e8e93; color: white; }
    </style>
</head>
<body>

<div class="card">
    <h2>📍 GPX 距離與時間計算版</h2>
    
    <div class="input-group">
        <label>座標輸入：</label>
        <textarea id="coordsInput" placeholder="貼入座標清單..."></textarea>
    </div>

    <div class="input-group">
        <label>預計時速 (km/h)：</label>
        <input type="number" id="speedInput" class="speed-input" value="10" step="0.1">
    </div>

    <div class="btn-group">
        <button class="btn-main" onclick="handleGenerate('download')">💾 生成並下載 GPX</button>
        <button class="btn-copy" onclick="handleGenerate('copy')">📋 僅拷貝代碼</button>
    </div>

    <div id="statsBox" class="stats-box">
        <div class="stats-item"><b>總行駛距離：</b> <span id="distRes">0</span> 公尺</div>
        <div class="stats-item"><b>預估總耗時：</b> <span id="timeRes">0</span></div>
    </div>
</div>

<script>
const RADIUS = 36;
const LAT_M_PER_DEG = 111132;
const EARTH_RADIUS = 6371000; // 公尺

const RULES = {
    "NE_SE": [45, 315, "01", 225, 135], "NE_SW": [45, 315, "01", 135, 225],
    "NE_NW": [45, 135, "01", 225, 315], "NE_NE": [45, 135, "01", 225, 315],
    "NW_NE": [315, 225, "01", 135, 45], "NW_SE": [315, 45, "01", 225, 135],
    "NW_SW": [315, 45, "01", 135, 225], "NW_NW": [315, 225, "01", 135, 45],
    "SE_SW": [135, 45, "01", 315, 225], "SE_NW": [135, 225, "01", 45, 315],
    "SE_NE": [135, 225, "01", 315, 45], "SE_SE": [135, 45, "01", 315, 225],
    "SW_NW": [225, 135, "01", 45, 315], "SW_NE": [225, 135, "01", 315, 45],
    "SW_SE": [225, 315, "01", 45, 135], "SW_SW": [225, 135, "01", 45, 315]
};

function getDistance(p1, p2) {
    const dLat = (p2.lat - p1.lat) * Math.PI / 180;
    const dLon = (p2.lon - p1.lon) * Math.PI / 180;
    const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
              Math.cos(p1.lat * Math.PI / 180) * Math.cos(p2.lat * Math.PI / 180) *
              Math.sin(dLon / 2) * Math.sin(dLon / 2);
    return 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)) * EARTH_RADIUS;
}

function handleGenerate(mode) {
    const input = document.getElementById('coordsInput').value;
    const speedKmH = parseFloat(document.getElementById('speedInput').value) || 10;
    
    // 1. 解析並去重
    let raw = [];
    input.split('\n').forEach(line => {
        let p = line.split(/[,|\s]+/);
        if (p.length >= 2) {
            let lat = parseFloat(p[0]), lon = parseFloat(p[1]);
            if (!isNaN(lat) && !isNaN(lon)) {
                // 防止完全重複的點進入計算
                if (!raw.some(c => c.lat === lat && c.lon === lon)) {
                    raw.push({lat, lon});
                }
            }
        }
    });

    if (raw.length === 0) return alert("請輸入有效座標");

    // 2. 執行權重排序：北 > 東 > 西 > 南
    // 邏輯：緯度越高(北)越前面；緯度相同時，經度越大(東)越前面
    let centers = raw.sort((a, b) => {
        if (b.lat !== a.lat) {
            return b.lat - a.lat; // 緯度由大到小 (北 -> 南)
        }
        return b.lon - a.lon; // 經度由大到小 (東 -> 西)
    });

    // 3. 邏輯套用與生成點位 (此部分保持與先前 16 條方位邏輯一致)
    let allPoints = [];
    centers.forEach((center, i) => {
        let prev = i > 0 ? centers[i-1] : null;
        let next = i < centers.length - 1 ? centers[i+1] : null;
        let qP = prev ? getQuadrant(center, prev) : (next ? getQuadrant(center, next) : "NE");
        let qN = next ? getQuadrant(center, next) : qP;
        let path = RULES[`${qP}_${qN}`] || [45, 135, "01", 225, 315];

        path.forEach(step => {
            let fLat, fLon;
            if (step === "01") { fLat = center.lat; fLon = center.lon; }
            else {
                let rad = step * Math.PI / 180;
                fLat = center.lat + (RADIUS * Math.cos(rad) / LAT_M_PER_DEG);
                fLon = center.lon + (RADIUS * Math.sin(rad) / (LAT_M_PER_DEG * Math.cos(center.lat * Math.PI / 180)));
            }
            allPoints.push({ lat: fLat, lon: fLon, label: `Z${(i+1).toString().padStart(2,'0')}-${step}` });
        });
    });

    // 4. 計算統計數據 (距離與時間)
    let totalDist = 0;
    for (let i = 0; i < allPoints.length - 1; i++) {
        totalDist += getDistance(allPoints[i], allPoints[i+1]);
    }

    let totalSeconds = totalDist / (speedKmH * 1000 / 3600);
    let mins = Math.floor(totalSeconds / 60);
    let secs = Math.round(totalSeconds % 60);

    document.getElementById('statsBox').style.display = 'block';
    document.getElementById('distRes').innerText = totalDist.toFixed(2);
    document.getElementById('timeRes').innerText = `${mins} 分 ${secs} 秒`;

    // 5. 輸出 GPX
    let gpx = '<?xml version="1.0" encoding="UTF-8"?><gpx version="1.1" creator="GPX-Weight-Scanner">';
    allPoints.forEach(p => {
        gpx += `\n<wpt lat="${p.lat.toFixed(6)}" lon="${p.lon.toFixed(6)}"><name>${p.label}</name></wpt>`;
    });
    gpx += '\n</gpx>';

    if (mode === 'download') {
        const blob = new Blob([gpx], {type: 'application/gpx+xml'});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `route_weighted_${new Date().getTime()}.gpx`;
        a.click();
    } else {
        navigator.clipboard.writeText(gpx).then(() => alert("排序完成，代碼已複製！"));
    }
}

</script>
</body>
</html>
