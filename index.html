<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Suderpanda GPX v2.7</title>
    <style>
        :root { --primary: #6c5ce7; --success: #00b894; --bg: #f8f9fa; }
        body { font-family: system-ui, sans-serif; background: var(--bg); padding: 15px; color: #2d3436; margin: 0; }
        .card { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: var(--primary); font-size: 18px; margin-bottom: 12px; }
        textarea { width: 100%; height: 60px; border: 2px solid #e2e8f0; border-radius: 12px; padding: 8px; box-sizing: border-box; font-size: 12px; margin-bottom: 10px; }
        
        .map-container { position: relative; width: 100%; background: #1e272e; border-radius: 16px; margin-bottom: 15px; height: 320px; overflow: hidden; border: 1px solid #dcdde1; }
        canvas { width: 100%; height: 100%; display: block; }
        
        .btn-group { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 15px; }
        button { padding: 12px 2px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 13px; color: white; }
        .btn-analyze { background: var(--success); }
        .btn-copy { background: #0984e3; }
        .btn-download { background: var(--primary); }

        /* 網格化排序清單 */
        #sortableList { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(50px, 1fr)); 
            gap: 10px; 
            padding: 0; 
            margin: 0; 
        }
        .sort-item { 
            background: #fff; border: 2px solid #eee; height: 50px; border-radius: 12px; 
            display: flex; align-items: center; justify-content: center; 
            font-size: 16px; font-weight: bold; color: var(--primary);
            touch-action: none; user-select: none; position: relative;
        }
        .sort-item.dragging { background: #e0e0ff; border-color: var(--primary); transform: scale(1.1); z-index: 100; box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        
        #toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); color: white; padding: 8px 20px; border-radius: 20px; font-size: 13px; opacity: 0; transition: 0.3s; z-index: 1000; pointer-events: none; }
    </style>
</head>
<body>

<div class="card">
    <h1>🐼 GPX v2.7 (雙層象限 & 網格版)</h1>
    <textarea id="coordsInput" placeholder="貼上座標..."></textarea>

    <div class="btn-group">
        <button class="btn-analyze" onclick="analyzePoints()">🔍 分析排序</button>
        <button class="btn-copy" onclick="copyFinalGPX()">📋 複製內容</button>
        <button class="btn-download" onclick="downloadFinalGPX()">💾 下載檔案</button>
    </div>

    <div class="map-container">
        <canvas id="mapCanvas"></canvas>
    </div>

    <div style="font-size: 12px; color: #636e72; margin-bottom: 10px;">👇 <b>長按編號</b>可拖曳排序（1 🟢 ➜ 末 🔴）：</div>
    <ul id="sortableList"></ul>
</div>

<div id="toast"></div>

<script>
let masterCenters = [];
let dragEl = null;
const RADIUS = 36;
const LAT_M_PER_DEG = 111132;

// --- 雙層象限核心邏輯 ---
function splitToFour(pts) {
    if (pts.length === 0) return [[],[],[],[]];
    let lats = pts.map(p => p.lat), lons = pts.map(p => p.lon);
    let midLat = (Math.min(...lats) + Math.max(...lats)) / 2;
    let midLon = (Math.min(...lons) + Math.max(...lons)) / 2;
    let res = [[],[],[],[]];
    pts.forEach(p => {
        if (p.lat >= midLat && p.lon >= midLon) res[0].push(p); // Q1(NE)
        else if (p.lat >= midLat && p.lon < midLon) res[1].push(p); // Q2(NW)
        else if (p.lat < midLat && p.lon < midLon) res[2].push(p); // Q3(SW)
        else res[3].push(p); // Q4(SE)
    });
    return res;
}

function extractOrdered(quads, orderArray) {
    let result = [];
    orderArray.forEach(idx => {
        if (quads[idx] && quads[idx].length > 0) {
            // 在每一最小單位內執行 TSP 以確保局部最短
            result.push(...runTSP(quads[idx], 0));
        }
    });
    return result;
}

function analyzePoints() {
    const inputStr = document.getElementById('coordsInput').value;
    let raw = [];
    inputStr.split('\n').forEach(line => {
        let p = line.trim().split(/[,|\s]+/);
        if (p.length >= 2) {
            let lat = parseFloat(p[0]), lon = parseFloat(p[1]);
            if (!isNaN(lat) && !isNaN(lon)) raw.push({lat, lon});
        }
    });
    if (raw.length === 0) return;
    raw = raw.filter((p, i, self) => i === self.findIndex(t => t.lat === p.lat && t.lon === p.lon));

    // 1. 第一層切分 (大象限)
    let BigQ = splitToFour(raw);
    
    // 2. 第二層切分 (小象限)
    let subQ = BigQ.map(q => splitToFour(q));

    masterCenters = [];
    // 執行你指定的自定義順序：
    // Q1 ➜ 4,1,2
    masterCenters.push(...extractOrdered(subQ[0], [3, 0, 1]));
    // Q2 ➜ 1,2,3
    masterCenters.push(...extractOrdered(subQ[1], [0, 1, 2]));
    // Q3 ➜ 2,3,4
    masterCenters.push(...extractOrdered(subQ[2], [1, 2, 3]));
    // Q4 ➜ 3,4,1
    masterCenters.push(...extractOrdered(subQ[3], [2, 3, 0]));
    
    // 補齊剩餘順序：Q4.2 ➜ Q3.1 ➜ Q2.4 ➜ Q1.3
    masterCenters.push(...extractOrdered(subQ[3], [1]));
    masterCenters.push(...extractOrdered(subQ[2], [0]));
    masterCenters.push(...extractOrdered(subQ[1], [3]));
    masterCenters.push(...extractOrdered(subQ[0], [2]));

    renderAll();
    showToast("🔍 雙層象限排序完成");
}

function runTSP(points, startIdx) {
    if (points.length <= 1) return points;
    let pool = [...points], ordered = [], current = pool.splice(startIdx, 1)[0];
    ordered.push(current);
    while(pool.length > 0) {
        let cIdx = 0, minDist = Infinity;
        pool.forEach((p, i) => {
            let d = Math.hypot(p.lat - current.lat, p.lon - current.lon);
            if(d < minDist) { minDist = d; cIdx = i; }
        });
        current = pool.splice(cIdx, 1)[0];
        ordered.push(current);
    }
    return ordered;
}

// --- 手機網格拖拽介面 ---
function renderSortableList() {
    const list = document.getElementById('sortableList');
    list.innerHTML = "";
    masterCenters.forEach((p, i) => {
        const li = document.createElement('li');
        li.className = 'sort-item';
        li.dataset.index = i;
        li.innerText = i + 1;
        li.addEventListener('touchstart', handleTouchStart, {passive: false});
        li.addEventListener('touchmove', handleTouchMove, {passive: false});
        li.addEventListener('touchend', handleTouchEnd);
        list.appendChild(li);
    });
}

function handleTouchStart(e) {
    dragEl = e.currentTarget;
    dragEl.classList.add('dragging');
}

function handleTouchMove(e) {
    e.preventDefault();
    const touch = e.touches[0];
    const target = document.elementFromPoint(touch.clientX, touch.clientY);
    if (!target) return;
    const closest = target.closest('.sort-item');
    const container = document.getElementById('sortableList');
    if (closest && closest !== dragEl) {
        const rect = closest.getBoundingClientRect();
        const next = touch.clientX > rect.left + rect.width / 2;
        container.insertBefore(dragEl, next ? closest.nextSibling : closest);
    }
}

function handleTouchEnd() {
    if (!dragEl) return;
    dragEl.classList.remove('dragging');
    const newList = Array.from(document.querySelectorAll('.sort-item'));
    masterCenters = newList.map(li => masterCenters[parseInt(li.dataset.index)]);
    dragEl = null;
    renderAll();
}

// --- 繪圖與導出 ---
function renderAll() { renderSortableList(); drawMap(); }

function drawMap() {
    const canvas = document.getElementById('mapCanvas');
    const ctx = canvas.getContext('2d');
    const dpr = window.devicePixelRatio || 1;
    const rect = canvas.getBoundingClientRect();
    canvas.width = rect.width * dpr; canvas.height = rect.height * dpr;
    ctx.scale(dpr, dpr);
    if (masterCenters.length === 0) return;
    const lats = masterCenters.map(p => p.lat), lons = masterCenters.map(p => p.lon);
    const minLat = Math.min(...lats), maxLat = Math.max(...lats);
    const minLon = Math.min(...lons), maxLon = Math.max(...lons);
    const pad = 40;
    const getX = (lon) => pad + (maxLon === minLon ? (rect.width-pad*2)/2 : (lon - minLon) / (maxLon - minLon) * (rect.width - pad * 2));
    const getY = (lat) => pad + (maxLat === minLat ? (rect.height-pad*2)/2 : (maxLat - lat) / (maxLat - minLat) * (rect.height - pad * 2));

    ctx.clearRect(0,0,rect.width, rect.height);
    ctx.beginPath(); ctx.strokeStyle = "#f1c40f"; ctx.lineWidth = 1.5; ctx.setLineDash([4,2]);
    masterCenters.forEach((p, i) => {
        const x = getX(p.lon), y = getY(p.lat);
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    });
    ctx.stroke(); ctx.setLineDash([]);
    masterCenters.forEach((p, i) => {
        const x = getX(p.lon), y = getY(p.lat);
        ctx.fillStyle = (i === 0) ? "#2ecc71" : (i === masterCenters.length-1 ? "#e74c3c" : "#6c5ce7");
        ctx.beginPath(); ctx.arc(x, y, 4, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = "white"; ctx.font = "bold 9px Arial"; ctx.textAlign = "center";
        ctx.fillText(i + 1, x, y - 7);
    });
}

function buildGPX() {
    const RULES = { "NE_SE": [45, 315, "01", 225, 135], "NE_SW": [45, 315, "01", 135, 225], "NE_NW": [45, 135, "01", 225, 315], "NW_NE": [315, 225, "01", 135, 45], "NW_SE": [315, 45, "01", 225, 135], "NW_SW": [315, 45, "01", 135, 225], "SE_SW": [135, 45, "01", 315, 225], "SE_NW": [135, 225, "01", 45, 315], "SE_NE": [135, 225, "01", 315, 45], "SW_NW": [225, 135, "01", 45, 315], "SW_NE": [225, 135, "01", 315, 45], "SW_SE": [225, 315, "01", 45, 135] };
    const getQ = (c, t) => { let dLat = t.lat-c.lat, dLon = t.lon-c.lon; return (dLat>=0 && dLon>=0)?"NE":(dLat>=0 && dLon<0)?"NW":(dLat<0 && dLon<0)?"SW":"SE"; };
    let gpx = '<?xml version="1.0" encoding="UTF-8"?><gpx version="1.1">';
    masterCenters.forEach((center, i) => {
        let prev = i > 0 ? masterCenters[i-1] : masterCenters[masterCenters.length-1];
        let next = i < masterCenters.length-1 ? masterCenters[i+1] : masterCenters[0];
        let path = RULES[`${getQ(center, prev)}_${getQ(center, next)}`] || [45, 135, "01", 225, 315];
        path.forEach((step, sub) => {
            let lat = center.lat, lon = center.lon;
            if (step !== "01") {
                let r = step * Math.PI / 180;
                lat += (RADIUS * Math.cos(r) / LAT_M_PER_DEG);
                lon += (RADIUS * Math.sin(r) / (LAT_M_PER_DEG * Math.cos(center.lat * Math.PI / 180)));
            }
            gpx += `\n<wpt lat="${lat.toFixed(6)}" lon="${lon.toFixed(6)}"><name>M${String(i+1).padStart(2,'0')}.${sub+1}</name></wpt>`;
        });
    });
    return gpx + '\n</gpx>';
}

async function copyFinalGPX() {
    if (masterCenters.length === 0) return;
    try { await navigator.clipboard.writeText(buildGPX()); showToast("📋 已複製 GPX"); }
    catch (e) { showToast("❌ 複製失敗"); }
}

function downloadFinalGPX() {
    if (masterCenters.length === 0) return;
    const blob = new Blob([buildGPX()], {type: 'application/gpx+xml'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = `Suderpanda_v27_${Date.now()}.gpx`; a.click();
}

function showToast(msg) {
    const t = document.getElementById('toast'); t.innerText = msg; t.style.opacity = "1";
    setTimeout(() => t.style.opacity = "0", 2000);
}
</script>
</body>
</html>
