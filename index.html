<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suderpanda GPX 座標生產器 v1.0</title>
    <style>
        :root { --primary: #ff4757; --secondary: #2f3542; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #f1f2f6; margin: 0; padding: 20px; color: #2f3542; }
        .card { max-width: 800px; margin: auto; background: white; padding: 35px; border-radius: 28px; box-shadow: 0 15px 50px rgba(0,0,0,0.1); }
        h1 { margin-top: 0; color: var(--primary); font-size: 24px; text-align: center; border-bottom: 2px solid #f1f2f6; padding-bottom: 20px; }
        .badge { background: var(--primary); color: white; font-size: 12px; padding: 4px 12px; border-radius: 50px; vertical-align: middle; margin-left: 10px; }
        .input-group { margin-top: 25px; }
        label { display: block; font-weight: 700; margin-bottom: 10px; font-size: 15px; color: #57606f; }
        textarea { width: 100%; height: 200px; border: 2px solid #dfe4ea; border-radius: 16px; padding: 15px; font-family: "SF Mono", "Courier New", monospace; font-size: 14px; box-sizing: border-box; transition: 0.3s; resize: vertical; }
        textarea:focus { border-color: var(--primary); outline: none; box-shadow: 0 0 0 4px rgba(255, 71, 87, 0.1); }
        .config-row { display: flex; gap: 20px; margin-top: 20px; }
        .speed-input { width: 120px; padding: 12px; border: 2px solid #dfe4ea; border-radius: 12px; font-size: 16px; text-align: center; }
        .stats-box { background: #f9f9fb; border-radius: 18px; padding: 20px; margin-top: 25px; border: 1px solid #e1e1e1; display: none; }
        .stats-item { font-size: 16px; margin-bottom: 8px; display: flex; justify-content: space-between; }
        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 30px; }
        button { padding: 18px; border: none; border-radius: 16px; font-size: 17px; font-weight: 700; cursor: pointer; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
        button:active { transform: scale(0.97); }
        .btn-main { background: var(--primary); color: white; box-shadow: 0 8px 20px rgba(255, 71, 87, 0.3); }
        .btn-main:hover { opacity: 0.9; box-shadow: 0 4px 10px rgba(255, 71, 87, 0.3); }
        .btn-copy { background: #747d8c; color: white; }
    </style>
</head>
<body>

<div class="card">
    <h1>🐼 Suderpanda GPX 座標生產器 <span class="badge">v1.0</span></h1>
    
    <div class="input-group">
        <label>座標輸入 (每行一個 緯度,經度)：</label>
        <textarea id="coordsInput" placeholder="24.123456, 120.654321&#10;24.123789, 120.654987..."></textarea>
    </div>

    <div class="config-row">
        <div>
            <label>預計時速 (km/h)：</label>
            <input type="number" id="speedInput" class="speed-input" value="10" step="0.1">
        </div>
    </div>

    <div class="btn-group">
        <button class="btn-main" onclick="handleGenerate('download')">💾 生成並下載 GPX</button>
        <button class="btn-copy" onclick="handleGenerate('copy')">📋 複製 GPX 代碼</button>
    </div>

    <div id="statsBox" class="stats-box">
        <div class="stats-item"><span>📏 總行駛距離：</span><b id="distRes">0</b></div>
        <div class="stats-item"><span>⏱️ 預估總耗時：</span><b id="timeRes">0</b></div>
        <div style="font-size: 12px; color: #a4b0be; margin-top: 10px; text-align: center;">優化模式：TSP 全局最短路徑 + 動態方位銜接邏輯</div>
    </div>
</div>

<script>
const RADIUS = 36;
const LAT_M_PER_DEG = 111132;
const EARTH_RADIUS = 6371000;

const RULES = {
    "NE_SE": [45, 315, "01", 225, 135], "NE_SW": [45, 315, "01", 135, 225],
    "NE_NW": [45, 135, "01", 225, 315], "NE_NE": [45, 135, "01", 225, 315],
    "NW_NE": [315, 225, "01", 135, 45], "NW_SE": [315, 45, "01", 225, 135],
    "NW_SW": [315, 45, "01", 135, 225], "NW_NW": [315, 225, "01", 135, 45],
    "SE_SW": [135, 45, "01", 315, 225], "SE_NW": [135, 225, "01", 45, 315],
    "SE_NE": [135, 225, "01", 315, 45], "SE_SE": [135, 45, "01", 315, 225],
    "SW_NW": [225, 135, "01", 45, 315], "SW_NE": [225, 135, "01", 315, 45],
    "SW_SE": [225, 315, "01", 45, 135], "SW_SW": [225, 135, "01", 45, 315]
};

function getDistance(p1, p2) {
    const dLat = (p2.lat - p1.lat) * Math.PI / 180;
    const dLon = (p2.lon - p1.lon) * Math.PI / 180;
    const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
              Math.cos(p1.lat * Math.PI / 180) * Math.cos(p2.lat * Math.PI / 180) *
              Math.sin(dLon / 2) * Math.sin(dLon / 2);
    return 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)) * EARTH_RADIUS;
}

function getQuadrant(curr, target) {
    let dLat = target.lat - curr.lat;
    let dLon = target.lon - curr.lon;
    if (dLat >= 0 && dLon >= 0) return "NE";
    if (dLat >= 0 && dLon < 0)  return "NW";
    if (dLat < 0 && dLon < 0)   return "SW";
    return "SE";
}

// 支援 iOS 捷徑 URL 傳遞並自動生成
window.onload = function() {
    const urlParams = new URLSearchParams(window.location.search);
    const coords = urlParams.get('data');
    if (coords) {
        document.getElementById('coordsInput').value = decodeURIComponent(coords);
        handleGenerate('copy'); // 自動執行
    }
}

function handleGenerate(mode) {
    const inputStr = document.getElementById('coordsInput').value;
    const speedKmH = parseFloat(document.getElementById('speedInput').value) || 10;
    
    let raw = [];
    inputStr.split('\n').forEach(line => {
        let p = line.trim().split(/[,|\s]+/);
        if (p.length >= 2) {
            let lat = parseFloat(p[0]), lon = parseFloat(p[1]);
            if (!isNaN(lat) && !isNaN(lon)) raw.push({lat, lon});
        }
    });

    if (raw.length === 0) return alert("請輸入有效座標");

    // --- 修正：剔除重複座標點 ---
    raw = raw.filter((point, index, self) =>
        index === self.findIndex((p) => (
            p.lat === point.lat && p.lon === point.lon
        ))
    );

    // --- TSP 排序 (最近鄰法) ---
    let centers = [];
    let current = raw.shift();
    centers.push(current);
    while (raw.length > 0) {
        let closestIdx = 0, minDist = Infinity;
        for (let i = 0; i < raw.length; i++) {
            let d = Math.hypot(raw[i].lat - current.lat, raw[i].lon - current.lon);
            if (d < minDist) { minDist = d; closestIdx = i; }
        }
        current = raw.splice(closestIdx, 1)[0];
        centers.push(current);
    }

    // --- 生成子點位路徑 ---
    let allPoints = [];
    centers.forEach((center, i) => {
        let prev = i > 0 ? centers[i-1] : centers[centers.length - 1];
        let next = i < centers.length - 1 ? centers[i+1] : centers[0];
        let qP = getQuadrant(center, prev);
        let qN = getQuadrant(center, next);
        let path = [];

        if (qP === qN) {
            // 同象限比較邏輯
            if (qP === "NE") path = (prev.lon > next.lon) ? [315, 225, "01", 135, 45] : [45, 135, "01", 225, 315];
            else if (qP === "NW") path = (prev.lon < next.lon) ? [45, 135, "01", 225, 315] : [315, 225, "01", 135, 45];
            else if (qP === "SW") path = (prev.lon < next.lon) ? [135, 45, "01", 315, 225] : [225, 315, "01", 45, 135];
            else if (qP === "SE") path = (prev.lon > next.lon) ? [225, 315, "01", 45, 135] : [135, 45, "01", 315, 225];
        } else {
            // 不同象限採用 16 條預設規則
            path = RULES[`${qP}_${qN}`] || [45, 135, "01", 225, 315];
        }

        path.forEach((step, subIdx) => {
            let fLat, fLon;
            if (step === "01") { fLat = center.lat; fLon = center.lon; }
            else {
                let rad = step * Math.PI / 180;
                fLat = center.lat + (RADIUS * Math.cos(rad) / LAT_M_PER_DEG);
                fLon = center.lon + (RADIUS * Math.sin(rad) / (LAT_M_PER_DEG * Math.cos(center.lat * Math.PI / 180)));
            }
            // 點位名稱格式: P1.1, P1.2...
            allPoints.push({ lat: fLat, lon: fLon, label: `P${i+1}.${subIdx+1}` });
        });
    });

    // --- 統計計算 ---
    let totalDist = 0;
    for (let i = 0; i < allPoints.length - 1; i++) {
        totalDist += getDistance(allPoints[i], allPoints[i+1]);
    }
    let totalSeconds = totalDist / (speedKmH * 1000 / 3600);
    let mins = Math.floor(totalSeconds / 60);
    let secs = Math.round(totalSeconds % 60);

    document.getElementById('statsBox').style.display = 'block';
    document.getElementById('distRes').innerText = totalDist.toFixed(2) + " 公尺";
    document.getElementById('timeRes').innerText = `${mins} 分 ${secs} 秒`;

    // --- GPX 封裝 ---
    let gpx = '<?xml version="1.0" encoding="UTF-8"?><gpx version="1.1" creator="Suderpanda-GPX-v1.0">';
    allPoints.forEach(p => {
        gpx += `\n<wpt lat="${p.lat.toFixed(6)}" lon="${p.lon.toFixed(6)}"><name>${p.label}</name></wpt>`;
    });
    gpx += '\n</gpx>';

    if (mode === 'download') {
        const blob = new Blob([gpx], {type: 'application/gpx+xml'});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `Suderpanda_Route_${new Date().getTime()}.gpx`;
        a.click();
    } else {
        navigator.clipboard.writeText(gpx).then(() => alert("GPX 代碼已複製！"));
    }
}
</script>
</body>
</html>
