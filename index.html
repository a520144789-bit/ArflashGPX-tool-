<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Suderpanda GPX v2.6</title>
    <style>
        :root { --primary: #6c5ce7; --success: #00b894; --bg: #f8f9fa; }
        body { font-family: system-ui, sans-serif; background: var(--bg); padding: 15px; color: #2d3436; margin: 0; }
        .card { max-width: 900px; margin: auto; background: white; padding: 20px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: var(--primary); font-size: 20px; margin-bottom: 15px; }
        textarea { width: 100%; height: 80px; border: 2px solid #e2e8f0; border-radius: 12px; padding: 10px; box-sizing: border-box; font-size: 13px; margin-bottom: 10px; }
        
        .map-container { position: relative; width: 100%; background: #1e272e; border-radius: 16px; margin-bottom: 15px; height: 350px; overflow: hidden; border: 1px solid #dcdde1; }
        canvas { width: 100%; height: 100%; display: block; }
        
        .btn-group { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 15px; }
        button { padding: 12px 5px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 13px; color: white; }
        .btn-analyze { background: var(--success); }
        .btn-copy { background: #0984e3; }
        .btn-download { background: var(--primary); }

        /* 排序清單優化 */
        #sortableList { list-style: none; padding: 0; margin: 0; }
        .sort-item { 
            background: #fff; border: 1px solid #eee; padding: 12px; border-radius: 10px; 
            margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between; 
            font-size: 14px; touch-action: none; /* 重要：防止瀏覽器預設滾動 */
            user-select: none;
        }
        .sort-item.dragging { background: #e0e0ff; border: 2px dashed var(--primary); opacity: 0.8; }
        .sort-item .idx { background: var(--primary); color: white; width: 22px; height: 22px; border-radius: 4px; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; margin-right: 10px; }
        
        #toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); color: white; padding: 8px 20px; border-radius: 20px; font-size: 13px; opacity: 0; transition: 0.3s; z-index: 1000; }
    </style>
</head>
<body>

<div class="card">
    <h1>🐼 GPX v2.6 (手機拖曳優化版)</h1>
    <textarea id="coordsInput" placeholder="貼上座標..."></textarea>

    <div class="btn-group">
        <button class="btn-analyze" onclick="analyzePoints()">🔍 分析</button>
        <button class="btn-copy" onclick="copyFinalGPX()">📋 複製</button>
        <button class="btn-download" onclick="downloadFinalGPX()">💾 下載</button>
    </div>

    <div class="map-container">
        <canvas id="mapCanvas"></canvas>
    </div>

    <div style="font-size: 12px; color: #636e72; margin-bottom: 10px;">👇 <b>長按並上下拖動</b> 數字塊可調整順序：</div>
    <ul id="sortableList"></ul>
</div>

<div id="toast"></div>

<script>
let masterCenters = [];
const RADIUS = 36;
const LAT_M_PER_DEG = 111132;

// --- 解析與核心邏輯 (同前版) ---
function analyzePoints() {
    const inputStr = document.getElementById('coordsInput').value;
    let raw = [];
    inputStr.split('\n').forEach(line => {
        let p = line.trim().split(/[,|\s]+/);
        if (p.length >= 2) {
            let lat = parseFloat(p[0]), lon = parseFloat(p[1]);
            if (!isNaN(lat) && !isNaN(lon)) raw.push({lat, lon});
        }
    });
    if (raw.length === 0) return;
    raw = raw.filter((p, i, self) => i === self.findIndex(t => t.lat === p.lat && t.lon === p.lon));

    let minLat = Math.min(...raw.map(p => p.lat)), maxLat = Math.max(...raw.map(p => p.lat));
    let minLon = Math.min(...raw.map(p => p.lon)), maxLon = Math.max(...raw.map(p => p.lon));
    let cLat = (minLat + maxLat) / 2, cLon = (minLon + maxLon) / 2;

    let q = [[], [], [], []];
    raw.forEach(p => {
        if (p.lat >= cLat && p.lon >= cLon) q[0].push(p);
        else if (p.lat >= cLat && p.lon < cLon) q[1].push(p);
        else if (p.lat < cLat && p.lon < cLon) q[2].push(p);
        else q[3].push(p);
    });

    masterCenters = [];
    [0,1,2,3].forEach(i => { masterCenters.push(...runTSP(q[i], 0)); });
    renderAll();
    showToast("🔍 分析完成");
}

function runTSP(points, startIdx) {
    if (points.length === 0) return [];
    let pool = [...points], ordered = [], current = pool.splice(startIdx, 1)[0];
    ordered.push(current);
    while(pool.length > 0) {
        let cIdx = 0, minDist = Infinity;
        pool.forEach((p, i) => {
            let d = Math.hypot(p.lat - current.lat, p.lon - current.lon);
            if(d < minDist) { minDist = d; cIdx = i; }
        });
        current = pool.splice(cIdx, 1)[0];
        ordered.push(current);
    }
    return ordered;
}

// --- 手機觸控拖拽實作 ---
let dragEl = null;

function renderSortableList() {
    const list = document.getElementById('sortableList');
    list.innerHTML = "";
    masterCenters.forEach((p, i) => {
        const li = document.createElement('li');
        li.className = 'sort-item';
        li.dataset.index = i;
        li.innerHTML = `<div><span class="idx">${i+1}</span>${p.lat.toFixed(4)}, ${p.lon.toFixed(4)}</div><span>⠿</span>`;
        
        // 觸控事件
        li.addEventListener('touchstart', handleTouchStart, {passive: false});
        li.addEventListener('touchmove', handleTouchMove, {passive: false});
        li.addEventListener('touchend', handleTouchEnd);
        
        list.appendChild(li);
    });
}

function handleTouchStart(e) {
    dragEl = e.currentTarget;
    dragEl.classList.add('dragging');
}

function handleTouchMove(e) {
    e.preventDefault(); // 鎖定螢幕滾動
    const touch = e.touches[0];
    const target = document.elementFromPoint(touch.clientX, touch.clientY);
    const container = document.getElementById('sortableList');
    const closestItem = target ? target.closest('.sort-item') : null;

    if (closestItem && closestItem !== dragEl) {
        const rect = closestItem.getBoundingClientRect();
        const next = (touch.clientY - rect.top) / (rect.bottom - rect.top) > 0.5;
        container.insertBefore(dragEl, next ? closestItem.nextSibling : closestItem);
    }
}

function handleTouchEnd() {
    if (!dragEl) return;
    dragEl.classList.remove('dragging');
    
    // 重新抓取 DOM 順序更新數據
    const newList = Array.from(document.querySelectorAll('.sort-item'));
    const newMaster = newList.map(li => masterCenters[parseInt(li.dataset.index)]);
    masterCenters = newMaster;
    
    dragEl = null;
    renderAll(); // 重新編號與畫圖
}

// --- 繪圖與導出 (同前版) ---
function renderAll() {
    renderSortableList();
    drawMap();
}

function drawMap() {
    const canvas = document.getElementById('mapCanvas');
    const ctx = canvas.getContext('2d');
    const dpr = window.devicePixelRatio || 1;
    const rect = canvas.getBoundingClientRect();
    canvas.width = rect.width * dpr; canvas.height = rect.height * dpr;
    ctx.scale(dpr, dpr);
    if (masterCenters.length === 0) return;
    const lats = masterCenters.map(p => p.lat), lons = masterCenters.map(p => p.lon);
    const minLat = Math.min(...lats), maxLat = Math.max(...lats);
    const minLon = Math.min(...lons), maxLon = Math.max(...lons);
    const pad = 40;
    const getX = (lon) => pad + (maxLon === minLon ? (rect.width-pad*2)/2 : (lon - minLon) / (maxLon - minLon) * (rect.width - pad * 2));
    const getY = (lat) => pad + (maxLat === minLat ? (rect.height-pad*2)/2 : (maxLat - lat) / (maxLat - minLat) * (rect.height - pad * 2));

    ctx.clearRect(0,0,rect.width, rect.height);
    ctx.beginPath(); ctx.strokeStyle = "rgba(241,196,15,0.7)"; ctx.lineWidth = 2; ctx.setLineDash([5,3]);
    masterCenters.forEach((p, i) => {
        const x = getX(p.lon), y = getY(p.lat);
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    });
    ctx.stroke(); ctx.setLineDash([]);
    masterCenters.forEach((p, i) => {
        const x = getX(p.lon), y = getY(p.lat);
        ctx.fillStyle = (i === 0) ? "#2ecc71" : (i === masterCenters.length-1 ? "#e74c3c" : "#6c5ce7");
        ctx.beginPath(); ctx.arc(x, y, 5, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = "white"; ctx.font = "bold 10px sans-serif"; ctx.textAlign = "center";
        ctx.fillText(i + 1, x, y - 8);
    });
}

function buildGPX() {
    const RULES = { "NE_SE": [45, 315, "01", 225, 135], "NE_SW": [45, 315, "01", 135, 225], "NE_NW": [45, 135, "01", 225, 315], "NW_NE": [315, 225, "01", 135, 45], "NW_SE": [315, 45, "01", 225, 135], "NW_SW": [315, 45, "01", 135, 225], "SE_SW": [135, 45, "01", 315, 225], "SE_NW": [135, 225, "01", 45, 315], "SE_NE": [135, 225, "01", 315, 45], "SW_NW": [225, 135, "01", 45, 315], "SW_NE": [225, 135, "01", 315, 45], "SW_SE": [225, 315, "01", 45, 135] };
    const getQ = (c, t) => { let dLat = t.lat-c.lat, dLon = t.lon-c.lon; return (dLat>=0 && dLon>=0)?"NE":(dLat>=0 && dLon<0)?"NW":(dLat<0 && dLon<0)?"SW":"SE"; };
    let gpx = '<?xml version="1.0" encoding="UTF-8"?><gpx version="1.1">';
    masterCenters.forEach((center, i) => {
        let prev = i > 0 ? masterCenters[i-1] : masterCenters[masterCenters.length-1];
        let next = i < masterCenters.length-1 ? masterCenters[i+1] : masterCenters[0];
        let path = RULES[`${getQ(center, prev)}_${getQ(center, next)}`] || [45, 135, "01", 225, 315];
        path.forEach((step, sub) => {
            let lat = center.lat, lon = center.lon;
            if (step !== "01") {
                let r = step * Math.PI / 180;
                lat += (RADIUS * Math.cos(r) / LAT_M_PER_DEG);
                lon += (RADIUS * Math.sin(r) / (LAT_M_PER_DEG * Math.cos(center.lat * Math.PI / 180)));
            }
            gpx += `\n<wpt lat="${lat.toFixed(6)}" lon="${lon.toFixed(6)}"><name>M${String(i+1).padStart(2,'0')}.${sub+1}</name></wpt>`;
        });
    });
    return gpx + '\n</gpx>';
}

async function copyFinalGPX() {
    if (masterCenters.length === 0) return;
    try { await navigator.clipboard.writeText(buildGPX()); showToast("📋 已複製 GPX"); }
    catch (e) { showToast("❌ 複製失敗"); }
}

function downloadFinalGPX() {
    if (masterCenters.length === 0) return;
    const blob = new Blob([buildGPX()], {type: 'application/gpx+xml'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = `Suderpanda_${Date.now()}.gpx`; a.click();
}

function showToast(msg) {
    const t = document.getElementById('toast'); t.innerText = msg; t.style.opacity = "1";
    setTimeout(() => t.style.opacity = "0", 2000);
}
</script>
</body>
</html>
