<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suderpanda GPX v2.1</title>
    <style>
        :root { --primary: #6c5ce7; --secondary: #2d3436; --info: #00cec9; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #dfe6e9; margin: 0; padding: 20px; color: #2d3436; }
        .card { max-width: 850px; margin: auto; background: white; padding: 35px; border-radius: 30px; box-shadow: 0 20px 60px rgba(0,0,0,0.15); }
        h1 { margin-top: 0; color: var(--primary); font-size: 26px; text-align: center; border-bottom: 2px solid #f1f2f6; padding-bottom: 20px; }
        .badge { background: var(--primary); color: white; font-size: 12px; padding: 4px 12px; border-radius: 50px; vertical-align: middle; margin-left: 10px; }
        .input-group { margin-top: 25px; }
        label { display: block; font-weight: 700; margin-bottom: 10px; font-size: 15px; color: #636e72; }
        textarea { width: 100%; height: 200px; border: 2px solid #dfe4ea; border-radius: 18px; padding: 15px; font-family: "SF Mono", "Courier New", monospace; font-size: 14px; box-sizing: border-box; transition: 0.3s; }
        textarea:focus { border-color: var(--primary); outline: none; box-shadow: 0 0 0 4px rgba(108, 92, 231, 0.1); }
        .config-row { display: flex; gap: 20px; margin-top: 20px; }
        .speed-input { width: 120px; padding: 12px; border: 2px solid #dfe4ea; border-radius: 12px; font-size: 16px; text-align: center; }
        .stats-box { background: #f9f9fb; border-radius: 20px; padding: 25px; margin-top: 25px; border: 1px solid #e1e1e1; display: none; }
        .stats-item { font-size: 16px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .quadrant-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 15px 0; }
        .q-card { background: white; padding: 10px; border-radius: 12px; text-align: center; border: 1px solid #eee; font-size: 12px; }
        .q-card b { color: var(--primary); font-size: 14px; }
        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 30px; }
        button { padding: 18px; border: none; border-radius: 18px; font-size: 17px; font-weight: 700; cursor: pointer; transition: 0.2s; }
        .btn-main { background: var(--primary); color: white; box-shadow: 0 8px 20px rgba(108, 92, 231, 0.3); }
        .btn-copy { background: #b2bec3; color: white; }
    </style>
</head>
<body>

<div class="card">
    <h1>🐼 Suderpanda GPX <span class="badge">v2.1 終極版</span></h1>
    
    <div class="input-group">
        <label>座標輸入 (緯度, 經度)：</label>
        <textarea id="coordsInput" placeholder="24.123, 120.456..."></textarea>
    </div>

    <div class="config-row">
        <div>
            <label>預計時速 (km/h)：</label>
            <input type="number" id="speedInput" class="speed-input" value="18">
        </div>
    </div>

    <div class="btn-group">
        <button class="btn-main" onclick="handleGenerate('download')">💾 生成並下載 GPX</button>
        <button class="btn-copy" onclick="handleGenerate('copy')">📋 複製 GPX 代碼</button>
    </div>

    <div id="statsBox" class="stats-box">
        <div class="stats-item"><span>📏 總行駛距離：</span><b id="distRes">-</b></div>
        <div class="stats-item"><span>⏱️ 預估總耗時：</span><b id="timeRes">-</b></div>
        
        <div class="quadrant-grid">
            <div class="q-card">Q1(東北)<br><b id="q1Count">0</b></div>
            <div class="q-card">Q2(西北)<br><b id="q2Count">0</b></div>
            <div class="q-card">Q3(西南)<br><b id="q3Count">0</b></div>
            <div class="q-card">Q4(東南)<br><b id="q4Count">0</b></div>
        </div>

        <div class="stats-item" style="font-size: 14px; color: #636e72;">
            <span>📍 處理點數：<span id="totalInput">0</span> (排除重複：<span id="excludedCount">0</span>)</span>
        </div>
    </div>
</div>

<script>
const RADIUS = 36;
const LAT_M_PER_DEG = 111132;
const EARTH_RADIUS = 6371000;

const RULES = {
    "NE_SE": [45, 315, "01", 225, 135], "NE_SW": [45, 315, "01", 135, 225],
    "NE_NW": [45, 135, "01", 225, 315], "NE_NE": [45, 135, "01", 225, 315],
    "NW_NE": [315, 225, "01", 135, 45], "NW_SE": [315, 45, "01", 225, 135],
    "NW_SW": [315, 45, "01", 135, 225], "NW_NW": [315, 225, "01", 135, 45],
    "SE_SW": [135, 45, "01", 315, 225], "SE_NW": [135, 225, "01", 45, 315],
    "SE_NE": [135, 225, "01", 315, 45], "SE_SE": [135, 45, "01", 315, 225],
    "SW_NW": [225, 135, "01", 45, 315], "SW_NE": [225, 135, "01", 315, 45],
    "SW_SE": [225, 315, "01", 45, 135], "SW_SW": [225, 135, "01", 45, 315]
};

function getDistance(p1, p2) {
    const dLat = (p2.lat - p1.lat) * Math.PI / 180;
    const dLon = (p2.lon - p1.lon) * Math.PI / 180;
    const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
              Math.cos(p1.lat * Math.PI / 180) * Math.cos(p2.lat * Math.PI / 180) *
              Math.sin(dLon / 2) * Math.sin(dLon / 2);
    return 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)) * EARTH_RADIUS;
}

function getQuadrant(curr, target) {
    let dLat = target.lat - curr.lat;
    let dLon = target.lon - curr.lon;
    if (dLat >= 0 && dLon >= 0) return "NE";
    if (dLat >= 0 && dLon < 0)  return "NW";
    if (dLat < 0 && dLon < 0)   return "SW";
    return "SE";
}

function runTSP(points, startIdx) {
    if (points.length === 0) return [];
    let pool = [...points];
    let ordered = [];
    let current = pool.splice(startIdx, 1)[0];
    ordered.push(current);
    while(pool.length > 0) {
        let closestIdx = 0, minDist = Infinity;
        for(let i = 0; i < pool.length; i++) {
            let d = Math.hypot(pool[i].lat - current.lat, pool[i].lon - current.lon);
            if (d < minDist) { minDist = d; closestIdx = i; }
        }
        current = pool.splice(closestIdx, 1)[0];
        ordered.push(current);
    }
    return ordered;
}

function handleGenerate(mode) {
    const inputStr = document.getElementById('coordsInput').value;
    const speedKmH = parseFloat(document.getElementById('speedInput').value) || 10;
    let raw = [];
    inputStr.split('\n').forEach(line => {
        let p = line.trim().split(/[,|\s]+/);
        if (p.length >= 2) {
            let lat = parseFloat(p[0]), lon = parseFloat(p[1]);
            if (!isNaN(lat) && !isNaN(lon)) raw.push({lat, lon});
        }
    });

    if (raw.length === 0) return alert("請輸入座標");
    const originalCount = raw.length;
    raw = raw.filter((point, index, self) => index === self.findIndex((p) => (p.lat === point.lat && p.lon === point.lon)));
    const finalInputCount = raw.length;

    // 1. 四象限切分
    let minLat = Math.min(...raw.map(p => p.lat)), maxLat = Math.max(...raw.map(p => p.lat));
    let minLon = Math.min(...raw.map(p => p.lon)), maxLon = Math.max(...raw.map(p => p.lon));
    let cLat = (minLat + maxLat) / 2, cLon = (minLon + maxLon) / 2;

    let q = [[], [], [], []]; // q[0]=Q1, q[1]=Q2...
    raw.forEach(p => {
        if (p.lat >= cLat && p.lon >= cLon) q[0].push(p);
        else if (p.lat >= cLat && p.lon < cLon) q[1].push(p);
        else if (p.lat < cLat && p.lon < cLon) q[2].push(p);
        else q[3].push(p);
    });

    // 2. 決定各區起點並排序大點
    let sortedCenters = [];
    // Q1 起點: 最東北
    let s0 = 0, d0 = Infinity; q[0].forEach((p, i) => { let d = Math.hypot(p.lat-maxLat, p.lon-maxLon); if(d<d0){d0=d; s0=i;} });
    sortedCenters.push(...runTSP(q[0], s0));
    // Q2 起點: 最東邊
    let s1 = 0, m1 = -Infinity; q[1].forEach((p, i) => { if(p.lon>m1){m1=p.lon; s1=i;} });
    sortedCenters.push(...runTSP(q[1], s1));
    // Q3 起點: 最北邊
    let s2 = 0, m2 = -Infinity; q[2].forEach((p, i) => { if(p.lat>m2){m2=p.lat; s2=i;} });
    sortedCenters.push(...runTSP(q[2], s2));
    // Q4 起點: 最西邊
    let s3 = 0, m3 = Infinity; q[3].forEach((p, i) => { if(p.lon<m3){m3=p.lon; s3=i;} });
    sortedCenters.push(...runTSP(q[3], s3));

    // 3. 嵌套 20 條邏輯生成子點
    let finalPoints = [];
    sortedCenters.forEach((center, i) => {
        let prev = i > 0 ? sortedCenters[i-1] : sortedCenters[sortedCenters.length - 1];
        let next = i < sortedCenters.length - 1 ? sortedCenters[i+1] : sortedCenters[0];
        let qP = getQuadrant(center, prev), qN = getQuadrant(center, next);
        let path = [];

        if (qP === qN) {
            if (qP === "NE") path = (prev.lon > next.lon) ? [315, 225, "01", 135, 45] : [45, 135, "01", 225, 315];
            else if (qP === "NW") path = (prev.lon < next.lon) ? [45, 135, "01", 225, 315] : [315, 225, "01", 135, 45];
            else if (qP === "SW") path = (prev.lon < next.lon) ? [135, 45, "01", 315, 225] : [225, 315, "01", 45, 135];
            else if (qP === "SE") path = (prev.lon > next.lon) ? [225, 315, "01", 45, 135] : [135, 45, "01", 315, 225];
        } else {
            path = RULES[`${qP}_${qN}`] || [45, 135, "01", 225, 315];
        }

        path.forEach((step, subIdx) => {
            let fLat, fLon;
            if (step === "01") { fLat = center.lat; fLon = center.lon; }
            else {
                let rad = step * Math.PI / 180;
                fLat = center.lat + (RADIUS * Math.cos(rad) / LAT_M_PER_DEG);
                fLon = center.lon + (RADIUS * Math.sin(rad) / (LAT_M_PER_DEG * Math.cos(center.lat * Math.PI / 180)));
            }
            // 命名邏輯：Z[象限]-[大點順序].[子點順序]
            // 先找出該 center 屬於哪個象限
            let qIdx = 1;
            if (q[1].includes(center)) qIdx = 2; else if (q[2].includes(center)) qIdx = 3; else if (q[3].includes(center)) qIdx = 4;
            finalPoints.push({ lat: fLat, lon: fLon, label: `Z0${qIdx}-${String(i+1).padStart(2,'0')}.${subIdx+1}` });
        });
    });

    // 4. 更新 UI
    let totalDist = 0;
    for (let i = 0; i < finalPoints.length - 1; i++) totalDist += getDistance(finalPoints[i], finalPoints[i+1]);
    let totalSec = totalDist / (speedKmH * 1000 / 3600);
    document.getElementById('statsBox').style.display = 'block';
    document.getElementById('distRes').innerText = totalDist.toFixed(2) + " m";
    document.getElementById('timeRes').innerText = Math.floor(totalSec/60) + "m " + Math.round(totalSec%60) + "s";
    document.getElementById('q1Count').innerText = q[0].length; document.getElementById('q2Count').innerText = q[1].length;
    document.getElementById('q3Count').innerText = q[2].length; document.getElementById('q4Count').innerText = q[3].length;
    document.getElementById('totalInput').innerText = finalInputCount;
    document.getElementById('excludedCount').innerText = originalCount - finalInputCount;

    let gpx = '<?xml version="1.0" encoding="UTF-8"?><gpx version="1.1" creator="Suderpanda-GPX-v2.1">';
    finalPoints.forEach(p => { gpx += `\n<wpt lat="${p.lat.toFixed(6)}" lon="${p.lon.toFixed(6)}"><name>${p.label}</name></wpt>`; });
    gpx += '\n</gpx>';

    if (mode === 'download') {
        const blob = new Blob([gpx], {type: 'application/gpx+xml'});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `Suderpanda_Final_${new Date().getTime()}.gpx`;
        a.click();
    } else {
        navigator.clipboard.writeText(gpx).then(() => alert("終極版 GPX 已複製！"));
    }
}
</script>
</body>
</html>
