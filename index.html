<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPX 實驗室：TSP + 20動態邏輯</title>
    <style>
        :root { --primary: #5856d6; --success: #34c759; }
        body { font-family: -apple-system, system-ui; background: #f2f2f7; margin: 0; padding: 20px; color: #1c1e21; }
        .card { max-width: 850px; margin: auto; background: white; padding: 30px; border-radius: 24px; box-shadow: 0 10px 40px rgba(0,0,0,0.08); }
        h2 { margin-top: 0; color: var(--primary); display: flex; align-items: center; gap: 10px; }
        .experiment-tag { background: #ff9500; color: white; font-size: 12px; padding: 4px 10px; border-radius: 100px; }
        textarea { width: 100%; height: 180px; border: 2px solid #e5e5ea; border-radius: 16px; padding: 15px; font-family: monospace; box-sizing: border-box; transition: 0.3s; }
        textarea:focus { border-color: var(--primary); outline: none; }
        .stats-box { background: #f8f9fa; border-radius: 16px; padding: 20px; margin-top: 20px; border: 1px solid #eee; display: none; }
        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 25px; }
        button { padding: 18px; border: none; border-radius: 16px; font-size: 16px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .btn-main { background: var(--primary); color: white; }
        .btn-copy { background: #8e8e93; color: white; }
    </style>
</head>
<body>

<div class="card">
    <h2>🧪 實驗：TSP + 動態比較邏輯 <span class="experiment-tag">V2.0</span></h2>
    
    <div class="input-group">
        <label>輸入座標 (Lat, Lon)：</label>
        <textarea id="coordsInput" placeholder="請輸入點位清單..."></textarea>
    </div>

    <div class="btn-group">
        <button class="btn-main" onclick="handleGenerate('download')">🚀 執行 TSP 優化並下載</button>
        <button class="btn-copy" onclick="handleGenerate('copy')">📋 複製 GPX 代碼</button>
    </div>

    <div id="statsBox" class="stats-box">
        <div><b>總移動距離：</b> <span id="distRes">0</span> 公尺</div>
        <div><b>計算模式：</b> TSP 全局最短 + 動態切向優化</div>
    </div>
</div>

<script>
const RADIUS = 36;
const LAT_M_PER_DEG = 111132;
const EARTH_RADIUS = 6371000;

// 基本 16 條進出方向規則
const RULES = {
    "NE_SE": [45, 315, "01", 225, 135], "NE_SW": [45, 315, "01", 135, 225],
    "NE_NW": [45, 135, "01", 225, 315], "NE_NE": [45, 135, "01", 225, 315],
    "NW_NE": [315, 225, "01", 135, 45], "NW_SE": [315, 45, "01", 225, 135],
    "NW_SW": [315, 45, "01", 135, 225], "NW_NW": [315, 225, "01", 135, 45],
    "SE_SW": [135, 45, "01", 315, 225], "SE_NW": [135, 225, "01", 45, 315],
    "SE_NE": [135, 225, "01", 315, 45], "SE_SE": [135, 45, "01", 315, 225],
    "SW_NW": [225, 135, "01", 45, 315], "SW_NE": [225, 135, "01", 315, 45],
    "SW_SE": [225, 315, "01", 45, 135], "SW_SW": [225, 135, "01", 45, 315]
};

function getDistance(p1, p2) {
    const dLat = (p2.lat - p1.lat) * Math.PI / 180;
    const dLon = (p2.lon - p1.lon) * Math.PI / 180;
    const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
              Math.cos(p1.lat * Math.PI / 180) * Math.cos(p2.lat * Math.PI / 180) *
              Math.sin(dLon / 2) * Math.sin(dLon / 2);
    return 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)) * EARTH_RADIUS;
}

function getQuadrant(curr, target) {
    let dLat = target.lat - curr.lat;
    let dLon = target.lon - curr.lon;
    if (dLat >= 0 && dLon >= 0) return "NE";
    if (dLat >= 0 && dLon < 0)  return "NW";
    if (dLat < 0 && dLon < 0)   return "SW";
    return "SE";
}

function handleGenerate(mode) {
    const input = document.getElementById('coordsInput').value;
    let raw = [];
    input.split('\n').forEach(line => {
        let p = line.trim().split(/[,|\s]+/);
        if (p.length >= 2) {
            let lat = parseFloat(p[0]), lon = parseFloat(p[1]);
            if (!isNaN(lat) && !isNaN(lon)) raw.push({lat, lon});
        }
    });

    if (raw.length === 0) return alert("請輸入有效座標");

    // --- 步驟 1: TSP (最近鄰法) 排序 ---
    let centers = [];
    let current = raw.shift();
    centers.push(current);

    while (raw.length > 0) {
        let closestIdx = 0;
        let minDist = Infinity;
        for (let i = 0; i < raw.length; i++) {
            let d = Math.hypot(raw[i].lat - current.lat, (raw[i].lon - current.lon));
            if (d < minDist) { minDist = d; closestIdx = i; }
        }
        current = raw.splice(closestIdx, 1)[0];
        centers.push(current);
    }

    // --- 步驟 2: 套用 20 條動態比較規則 ---
    let allPoints = [];
    centers.forEach((center, i) => {
        let prev = i > 0 ? centers[i-1] : centers[centers.length - 1];
        let next = i < centers.length - 1 ? centers[i+1] : centers[0];

        let qP = getQuadrant(center, prev);
        let qN = getQuadrant(center, next);
        let path = [];

        if (qP === qN) {
            // 這裡就是你優化的 4 條「同象限比較」邏輯 (加上原本 16 條共 20 條)
            if (qP === "NE") {
                path = (prev.lon > next.lon) ? [315, 225, "01", 135, 45] : [45, 135, "01", 225, 315];
            } else if (qP === "NW") {
                path = (prev.lon < next.lon) ? [45, 135, "01", 225, 315] : [315, 225, "01", 135, 45];
            } else if (qP === "SW") {
                path = (prev.lon < next.lon) ? [135, 45, "01", 315, 225] : [225, 315, "01", 45, 135];
            } else if (qP === "SE") {
                path = (prev.lon > next.lon) ? [225, 315, "01", 45, 135] : [135, 45, "01", 315, 225];
            }
        } else {
            path = RULES[`${qP}_${qN}`] || [45, 135, "01", 225, 315];
        }

        path.forEach(step => {
            let fLat, fLon;
            if (step === "01") { fLat = center.lat; fLon = center.lon; }
            else {
                let rad = step * Math.PI / 180;
                fLat = center.lat + (RADIUS * Math.cos(rad) / LAT_M_PER_DEG);
                fLon = center.lon + (RADIUS * Math.sin(rad) / (LAT_M_PER_DEG * Math.cos(center.lat * Math.PI / 180)));
            }
            allPoints.push({ lat: fLat, lon: fLon });
        });
    });

    // 統計與輸出
    let totalDist = 0;
    for (let i = 0; i < allPoints.length - 1; i++) {
        totalDist += getDistance(allPoints[i], allPoints[i+1]);
    }
    document.getElementById('statsBox').style.display = 'block';
    document.getElementById('distRes').innerText = totalDist.toFixed(2);

    let gpx = '<?xml version="1.0" encoding="UTF-8"?><gpx version="1.1" creator="TSP-Dynamic-Lab">';
    allPoints.forEach((p, i) => {
        gpx += `\n<wpt lat="${p.lat.toFixed(6)}" lon="${p.lon.toFixed(6)}"><name>T${i+1}</name></wpt>`;
    });
    gpx += '\n</gpx>';

    if (mode === 'download') {
        const blob = new Blob([gpx], {type: 'application/gpx+xml'});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `experiment_tsp_dynamic.gpx`;
        a.click();
    } else {
        navigator.clipboard.writeText(gpx).then(() => alert("GPX 已複製"));
    }
}
</script>
</body>
</html>
