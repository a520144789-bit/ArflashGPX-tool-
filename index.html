<script>
// ... 前面 masterCenters, SELECTED 等變數定義不變 ...

function analyzePoints() {
    const input = document.getElementById('coordsInput').value;
    let raw = [];
    
    // 1. 強化解析邏輯，確保各種格式（空格、逗號、換行）都能正確讀取
    const lines = input.split('\n');
    lines.forEach(line => {
        let p = line.trim().split(/[,|\s]+/);
        if (p.length >= 2) {
            let lat = parseFloat(p[0]), lon = parseFloat(p[1]);
            if (!isNaN(lat) && !isNaN(lon)) {
                raw.push({lat, lon});
            }
        }
    });

    if (raw.length === 0) {
        showToast("請輸入有效的座標點");
        return;
    }

    // 2. 改進重複過濾：僅過濾掉「完全一模一樣」的座標，避免遺漏接近點
    raw = raw.filter((p, i, self) => 
        i === self.findIndex(t => Math.abs(t.lat - p.lat) < 0.000001 && Math.abs(t.lon - p.lon) < 0.000001)
    );

    // 3. 改寫排序邏輯：直接使用全域最近鄰路徑 (TSP)，這能 100% 保留所有點位且路徑最順
    masterCenters = runTSP(raw);

    showToast(`成功讀取 ${masterCenters.length} 個座標點`);
    renderAll();
}

function runTSP(points) {
    if (points.length <= 1) return [...points];
    let pool = [...points];
    // 從輸入的第一個點開始
    let ordered = [pool.splice(0, 1)[0]];
    
    while (pool.length > 0) {
        let bestIndex = 0;
        let minDist = Infinity;
        let lastPoint = ordered[ordered.length - 1];
        
        for (let i = 0; i < pool.length; i++) {
            // 使用歐式距離平方快速判斷最近點，確保不遺漏任何一點
            let d = Math.pow(pool[i].lat - lastPoint.lat, 2) + Math.pow(pool[i].lon - lastPoint.lon, 2);
            if (d < minDist) {
                minDist = d;
                bestIndex = i;
            }
        }
        ordered.push(pool.splice(bestIndex, 1)[0]);
    }
    return ordered;
}

// ... 後續 renderList, drawMap 等函數保持 v3.0 版本 ...
</script>
